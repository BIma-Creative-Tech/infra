# Traefik v3.7.13 — static (install) configuration. T03, plan 02; ADR 0002 (HTTP-01 per hostname).
# Setiap opsi diverifikasi dari raw.githubusercontent.com/traefik/traefik/v3.7/docs/content/reference/...
# Perubahan file ini butuh restart container (static config tidak di-reload).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json          # ke stdout → docker json-file (10m x 3)

accessLog:
  # Dibaca CrowdSec (T05) & Alloy/Loki (T14). Rotasi: logrotate host + sinyal USR1
  # (docs logs-and-accesslogs.md §Log Rotation) — lihat traefik/logrotate/traefik.
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 100
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop   # default docs; header request tidak di-log (hindari cookie/Authorization)
      names:
        User-Agent: keep  # dibutuhkan skenario CrowdSec (bad user-agent)

entryPoints:
  web:
    address: ":80"
    http:
      # Redirect permanen ke https. Router ACME internal berprioritas MaxInt tetap melayani
      # /.well-known/acme-challenge/ (docs entrypoints.md §allowACMEByPass) — JANGAN set allowACMEByPass.
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
      # Header dengan nama "alias" (X_Sh_Odoo_Db, X.Odoo.Database, ...) dihapus agar tidak
      # bisa menyamar sebagai header terpercaya di backend WSGI (Odoo) — docs entrypoints.md §aliasHeadersStrategy.
      aliasHeadersStrategy: delete
    # forwardedHeaders.trustedIPs/insecure TIDAK diset: tidak ada proxy di depan Traefik,
    # X-Forwarded-* dari client tidak dipercaya (plan 02 §4 baris S).
  websecure:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
      tls: {}
  # H5 (keputusan user 2026-09-23): entrypoint KHUSUS panel admin (Keycloak /admin & realm master,
  # Grafana, dashboard Uptime Kuma). Compose mem-publish HANYA 127.0.0.1:8443 di host (SSH tunnel
  # `ssh -L 8443:127.0.0.1:8443`), tidak pernah 0.0.0.0. Hairpin ke IP publik :443 tidak lagi mencapai
  # router admin (router admin hanya di entrypoint ini). Di dalam container listen di semua interface:
  # container lain yang menghubungi traefik:8443 langsung tiba dengan IP container-nya sendiri →
  # 403 oleh ipallowlist-admin; hanya jalur loopback host yang tiba sebagai 10.100.0.1.
  # Format address `[host]:port[/tcp|/udp]` (docs v3.7 reference/install-configuration/entrypoints.md).
  admin:
    address: ":8443"
    http:
      aliasHeadersStrategy: delete
      tls: {}
  # Hanya untuk /ping healthcheck; terikat loopback DI DALAM container, tidak di-publish.
  traefik:
    address: "127.0.0.1:8080"
    http:
      aliasHeadersStrategy: delete

  # T14a: metrics Prometheus. Listen :8082 DI DALAM container, TIDAK di-publish ke host (compose hanya 80/443
  # + 127.0.0.1:8443). Tanpa alamat bind, socket ini terjangkau dari SEMUA network Traefik (proxy, odoo-edge,
  # web-edge, drms-kas-edge, crowdsec, metrics, …) — bukan hanya `metrics` (QA-T17B-03). Pembatasan ada di
  # router `metrics-prometheus` (dynamic/platform/metrics.yml): ipAllowList = subnet network `metrics`
  # (10.100.5.0/24, --internal); selain itu 403. Semua router di dynamic/ menyebut entryPoints eksplisit →
  # tidak ada router aplikasi yang menempel ke entrypoint ini.
  metrics:
    address: ":8082"
    http:
      aliasHeadersStrategy: delete

ping:
  entryPoint: traefik

# T14a — docs v3.7 reference/install-configuration/observability/metrics.md §Prometheus:
# `entryPoint` (default "traefik"), addEntryPointsLabels (default true), addRoutersLabels (default
# false), addServicesLabels (default true).
# QA-T17B-03: `manualRouting: true` (default false) mematikan router internal otomatis (source v3.7.13
# pkg/provider/traefik/internal.go: PathPrefix(`/metrics`), priority MaxInt, TANPA middleware) sehingga
# service `prometheus@internal` hanya dicapai lewat router file `metrics-prometheus`
# (dynamic/platform/metrics.yml, + ipAllowList). `entryPoint` di bawah hanya dipakai router otomatis;
# dibiarkan agar rollback = hapus `manualRouting` saja. Perubahan ini static → restart Traefik.
metrics:
  prometheus:
    entryPoint: metrics
    manualRouting: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

# api/dashboard: TIDAK diaktifkan (default api=false). Debug lewat `docker logs traefik`
# dan file dynamic/. Bila kelak dibutuhkan: aktifkan api tanpa `insecure`, router di entrypoint
# terpisah yang hanya bind 127.0.0.1 di host (SSH tunnel) — butuh keputusan Lead.

providers:
  # File provider saja — TIDAK ada docker provider / docker.sock (plan 02 §4 baris E).
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  # Uji awal — CA staging LE (URL dari https://letsencrypt.org/docs/staging-environment/).
  le-http-staging:
    acme:
      # email: kosong — lihat docs/03-operations/traefik.md (pertanyaan terbuka ke Lead).
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      storage: /etc/traefik/acme/acme-staging.json
      keyType: EC256
      httpChallenge:
        entryPoint: web
  # Production — DISIAPKAN, belum dipakai router mana pun (keputusan Lead setelah staging lolos).
  le-http:
    acme:
      # 2026-09-26 (insiden CAA, ADR 0002 #15b): email WAJIB — tanpa email Traefik mendaftar akun ACME baru setelah restart.
      email: postmaster@bimacreative.tech
      caServer: https://acme-v02.api.letsencrypt.org/directory
      storage: /etc/traefik/acme/acme.json
      keyType: EC256
      httpChallenge:
        entryPoint: web

# Plugin bouncer CrowdSec (T05). docs v3.7 reference/install-configuration/experimental/plugins.md.
# Modul & versi diverifikasi: repo maxlerebourg/crowdsec-bouncer-traefik-plugin, rilis v1.7.1
# (2026-07-31, bukan prerelease; ADR 0001), .traefik.yml `import:` = moduleName di bawah.
# Diunduh dari katalog plugins.traefik.io saat start ke /plugins-storage (tmpfs, compose).
experimental:
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.7.1
      # sha256 arsip dari katalog (dihitung Traefik, diverifikasi 2026-09-23: isi zip katalog
      # identik `diff -r` dengan arsip tag GitHub v1.7.1 commit bc83e9d). Mismatch → plugin ditolak.
      hash: "500739fc1600c12a651433b13a81693470cd336dbc7864cb85ee42098c93d884"
