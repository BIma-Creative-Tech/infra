# T03 — Traefik v3.7.13 edge (plan 02, ADR 0001/0002). File provider saja, tanpa docker.sock.
# Jalankan scripts/bootstrap.sh sekali sebelum `docker compose up -d` (network `proxy`,
# direktori acme/ & logs/ dengan owner/permission benar).
name: traefik

services:
  traefik:
    # ADR 0001: traefik:v3.7.13 (+ digest index multi-arch, diambil 2026-09-23)
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: traefik
    # H7 (keputusan user 2026-09-23, ADR 0001 riwayat revisi): `always`, BUKAN `unless-stopped` (pengecualian
    # CLAUDE.md §3.5) — satu-satunya pintu 80/443. `always` tetap di-start saat daemon Docker start walau
    # HasBeenManuallyStopped=true (docs Docker "Start containers automatically"; moby v29.8.1
    # restartmanager.ShouldRestart). Reload konfigurasi: `docker exec traefik kill -HUP 1`, bukan `docker kill`.
    restart: always
    # Non-root tanpa capability: Docker menset net.ipv4.ip_unprivileged_port_start=0 di netns
    # container, sehingga uid biasa boleh bind :80/:443 (diuji; NET_BIND_SERVICE tidak diperlukan
    # dan tidak efektif untuk proses non-root). Sysctl ditulis eksplisit agar tidak bergantung default.
    user: "65532:65532"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    command:
      - traefik
      - --configFile=/etc/traefik/traefik.yml
    ports:
      # Publik hanya 80/443 (IPv4; tidak ada AAAA — ADR 0002 #4) + 8443 loopback (H5).
      - "0.0.0.0:80:80/tcp"
      - "0.0.0.0:443:443/tcp"
      # H5: entrypoint `admin` (panel admin) — HANYA loopback host; akses admin via
      # `ssh -p 2221 -N -L 8443:127.0.0.1:8443 admin@31.97.50.221`. JANGAN ubah ke 0.0.0.0.
      - "127.0.0.1:8443:8443/tcp"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./acme:/etc/traefik/acme          # acme*.json 600, owner 65532
      - ./logs:/var/log/traefik           # access.log (CrowdSec T05), rotasi via logrotate host
      # API key bouncer CrowdSec (T05) — file 600 uid 65532, tidak di-commit (traefik/.gitignore).
      - ./secrets/crowdsec-bouncer.key:/etc/traefik/secrets/crowdsec-bouncer.key:ro
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
      # Plugin Traefik diunduh ke ./plugins-storage relatif WORKDIR "/" (source v3.7
      # cmd/traefik/plugins.go: outputDir = "./plugins-storage/"). Diunduh ulang tiap start.
      - /plugins-storage:uid=65532,gid=65532,mode=0700
    networks:
      proxy:
        # WAJIB: network gateway default = proxy. Tanpa ini Docker memilih `crowdsec` (urutan
        # nama) → port 80/443 di-DNAT lewat bridge crowdsec dan koneksi dari host/SSH tunnel
        # tiba sebagai 10.100.2.1, bukan 10.100.0.1 (ipallowlist-admin). Diuji 2026-09-23.
        gw_priority: 1
      crowdsec: {}   # T05: LAPI :8080 & AppSec :7422 container crowdsec (tidak ada di network proxy)
      # H1: backend Odoo prod (odoo-pool-a :8069/:8072) HANYA di network ini — bukan di
      # `proxy`. Tanpa gw_priority (default 0): gateway tetap `proxy` (lihat komentar di atas).
      odoo-edge: {}
      # ADR 0010 #4 (plan 06): backend Odoo STAGING (odoo-staging :8069/:8072) — edge terpisah dari prod. Tanpa
      # gw_priority: gateway tetap `proxy`.
      odoo-edge-stg: {}
      # ADR 0010 #3 (plan 06): Keycloak (keycloak:8080) HANYA di network ini (keluar dari `proxy`). Tanpa gw_priority:
      # gateway tetap `proxy`. DNS: urutan endpoint Traefik = proxy (gw_priority 1) → non-internal (nama) → internal,
      # sehingga `keycloak` di-resolve ke IP kc-edge (bukan `metrics`) — moby v29.8.1 daemon/libnetwork/sandbox.go
      # Endpoint.Less + Sandbox.ResolveName. IP sumber Traefik = 10.100.12.x = KC_PROXY_TRUSTED_ADDRESSES Keycloak.
      kc-edge: {}
      # ProyekKas DRMS: backend drms-pk-{web,stg}:3000 HANYA di network ini (bukan `proxy`).
      # Tanpa gw_priority (default 0): gateway tetap `proxy`.
      drms-kas-edge: {}
      # E10 ProyekKas DRMS PROD: drms-pk-web:3000 HANYA di network ini (edge prod terpisah dari staging, ADR 0010 #4).
      # Tanpa gw_priority: gateway tetap `proxy`. Live: `docker network connect drms-kas-edge-prod traefik`.
      drms-kas-edge-prod: {}
      # W2b: website client web-<slug>-<env>:3000 HANYA di network ini (bukan `proxy`). Tanpa gw_priority
      # (default 0): gateway tetap `proxy`.
      web-edge: {}
      # ADR 0012 (plan 08): webmail Roundcube (webmail:8000) HANYA di network ini. --internal → tanpa gateway, tidak
      # memengaruhi gateway Traefik (proxy tetap gw_priority 1).
      webmail-edge: {}
      # ADR 0013 (plan 11): Umami (umami:3000) HANYA di network ini. --internal → tanpa gateway (proxy tetap gw_priority 1).
      analytics-edge: {}
      # erajaya-loyalty STAGING (erajaya-staging-web:3000) HANYA di network ini. --internal → tanpa gateway (proxy tetap
      # gw_priority 1). Live: `docker network connect erajaya-edge-stg traefik`.
      erajaya-edge-stg: {}
      # ADR 0019: 9Router (9router:20128) HANYA di network ini. --internal → tanpa gateway (proxy tetap gw_priority 1).
      # Live: `docker network connect 9router-edge traefik` (2026-10-19).
      9router-edge: {}
      # T14a: network internal (--internal, 10.100.5.0/24) — Prometheus scrape :8082. Internal network
      # tidak punya gateway → tidak memengaruhi pemilihan gateway (proxy tetap gw_priority 1).
      metrics: {}
      # H5: network --internal khusus Admin REST ProyekKas (prod / staging). Alias
      # `auth.bimacreative.tech` → app di network ini me-resolve host Keycloak ke IP Traefik di
      # network tsb (tanpa hairpin), sehingga ClientIP = 10.100.8.x / 10.100.9.x → router
      # dynamic/clients/drms-proyekkas-kc-admin.yml. Internal = tanpa gateway → tanpa gw_priority,
      # `proxy` tetap gateway. Keycloak TIDAK join network ini.
      drms-kc-admin:
        aliases: [auth.bimacreative.tech]
      drms-kc-admin-stg:
        aliases: [auth.bimacreative.tech]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yml"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    # Dibuat oleh scripts/bootstrap.sh: bridge, subnet tetap 10.100.0.0/24, gateway 10.100.0.1.
    # Service HTTP lain join sebagai `external: true, name: proxy`.
    external: true
    name: proxy
  crowdsec:
    # Dibuat security/crowdsec/scripts/bootstrap.sh: 10.100.2.0/24 (T05).
    external: true
    name: crowdsec
  odoo-edge:
    # Dibuat scripts/bootstrap.sh: 10.100.3.0/24 (H1) — anggota: traefik + odoo-pool-a (prod) saja (plan 06).
    external: true
    name: odoo-edge
  odoo-edge-stg:
    # Dibuat scripts/bootstrap.sh: 10.100.13.0/24 gw 10.100.13.1 (ADR 0010) — anggota: traefik + odoo-staging saja.
    external: true
    name: odoo-edge-stg
  kc-edge:
    # Dibuat scripts/bootstrap.sh: 10.100.12.0/24 gw 10.100.12.1 (ADR 0010) — anggota: traefik + keycloak saja.
    external: true
    name: kc-edge
  drms-kas-edge:
    # Dibuat scripts/bootstrap.sh: 10.100.7.0/24 gw 10.100.7.1 — anggota: traefik + web ProyekKas DRMS staging saja.
    external: true
    name: drms-kas-edge
  drms-kas-edge-prod:
    # Dibuat scripts/bootstrap.sh: 10.100.14.0/24 gw 10.100.14.1 — anggota: traefik + web/worker ProyekKas DRMS prod saja.
    external: true
    name: drms-kas-edge-prod
  metrics:
    # Dibuat observability/scripts/bootstrap.sh: 10.100.5.0/24 --internal (T14a) — anggota:
    # prometheus + target scrape (traefik, crowdsec, keycloak).
    external: true
    name: metrics
  drms-kc-admin:
    # Dibuat scripts/bootstrap.sh: 10.100.8.0/24 --internal (H5) — anggota: traefik + app ProyekKas prod.
    external: true
    name: drms-kc-admin
  drms-kc-admin-stg:
    # Dibuat scripts/bootstrap.sh: 10.100.9.0/24 --internal (H5) — anggota: traefik + app ProyekKas staging.
    external: true
    name: drms-kc-admin-stg
  web-edge:
    # Dibuat scripts/bootstrap.sh: 10.100.11.0/24 gw 10.100.11.1 (W2b) — anggota: traefik + website client
    # web-<slug>-<env> saja (templates/web-client/docker-compose.yml).
    external: true
    name: web-edge
  webmail-edge:
    # Dibuat scripts/bootstrap.sh: 10.100.15.0/24 --internal (ADR 0012) — anggota: traefik + webmail saja.
    external: true
    name: webmail-edge
  analytics-edge:
    # Dibuat scripts/bootstrap.sh: 10.100.17.0/24 --internal (ADR 0013, plan 11) — anggota: traefik + umami saja.
    external: true
    name: analytics-edge
  erajaya-edge-stg:
    # Dibuat scripts/bootstrap.sh: 10.100.19.0/24 --internal — anggota: traefik + erajaya-staging-web saja.
    external: true
    name: erajaya-edge-stg
  9router-edge:
    # Dibuat scripts/bootstrap.sh: 10.100.40.0/24 --internal (ADR 0019) — anggota: traefik + 9router saja.
    external: true
    name: 9router-edge
