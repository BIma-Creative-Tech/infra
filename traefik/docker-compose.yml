# T03 — Traefik v3.7.13 edge (plan 02, ADR 0001/0002). File provider saja, tanpa docker.sock.
# Jalankan scripts/bootstrap.sh sekali sebelum `docker compose up -d` (network `proxy`,
# direktori acme/ & logs/ dengan owner/permission benar).
name: traefik

services:
  traefik:
    # ADR 0001: traefik:v3.7.13 (+ digest index multi-arch, diambil 2026-09-23)
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: traefik
    restart: unless-stopped
    # Non-root tanpa capability: Docker menset net.ipv4.ip_unprivileged_port_start=0 di netns
    # container, sehingga uid biasa boleh bind :80/:443 (diuji; NET_BIND_SERVICE tidak diperlukan
    # dan tidak efektif untuk proses non-root). Sysctl ditulis eksplisit agar tidak bergantung default.
    user: "65532:65532"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    command:
      - traefik
      - --configFile=/etc/traefik/traefik.yml
    ports:
      # Hanya 80/443 yang di-publish (IPv4; tidak ada AAAA — ADR 0002 #4).
      - "0.0.0.0:80:80/tcp"
      - "0.0.0.0:443:443/tcp"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./acme:/etc/traefik/acme          # acme*.json 600, owner 65532
      - ./logs:/var/log/traefik           # access.log (CrowdSec T05), rotasi via logrotate host
      # API key bouncer CrowdSec (T05) — file 600 uid 65532, tidak di-commit (traefik/.gitignore).
      - ./secrets/crowdsec-bouncer.key:/etc/traefik/secrets/crowdsec-bouncer.key:ro
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
      # Plugin Traefik diunduh ke ./plugins-storage relatif WORKDIR "/" (source v3.7
      # cmd/traefik/plugins.go: outputDir = "./plugins-storage/"). Diunduh ulang tiap start.
      - /plugins-storage:uid=65532,gid=65532,mode=0700
    networks:
      proxy:
        # WAJIB: network gateway default = proxy. Tanpa ini Docker memilih `crowdsec` (urutan
        # nama) → port 80/443 di-DNAT lewat bridge crowdsec dan koneksi dari host/SSH tunnel
        # tiba sebagai 10.100.2.1, bukan 10.100.0.1 (ipallowlist-admin). Diuji 2026-09-23.
        gw_priority: 1
      crowdsec: {}   # T05: LAPI :8080 & AppSec :7422 container crowdsec (tidak ada di network proxy)
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yml"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Service UJI T03 (router dynamic/test/whoami-status.yml). Tidak publish port.
  # Hapus bersama router uji saat T14 memasang Uptime Kuma di status.bimacreative.tech.
  whoami:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    container_name: whoami
    restart: unless-stopped
    user: "65532:65532"
    command: ["-port", "8080"]
    read_only: true
    networks:
      - proxy
    healthcheck:
      # Image scratch (hanya binary /whoami) — tidak ada shell/curl; binary tidak punya mode
      # healthcheck. Sehat = proses hidup; dicek dari Traefik via curl (lihat docs operasional).
      disable: true
    mem_limit: 32m
    cpus: 0.1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    # Dibuat oleh scripts/bootstrap.sh: bridge, subnet tetap 10.100.0.0/24, gateway 10.100.0.1.
    # Service HTTP lain join sebagai `external: true, name: proxy`.
    external: true
    name: proxy
  crowdsec:
    # Dibuat security/crowdsec/scripts/bootstrap.sh: 10.100.2.0/24 (T05).
    external: true
    name: crowdsec
