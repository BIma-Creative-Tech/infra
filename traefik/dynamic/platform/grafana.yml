# T14a — Grafana 13.2.2 di grafana.bimacreative.tech → container `grafana:3000` (network proxy).
# DNS pre-check (ADR 0002 #5) lulus 2026-09-23: A = 31.97.50.221 (@apollo.dns-parking.com, @1.1.1.1,
# @8.8.8.8), tanpa AAAA.
# SELURUH host di belakang ipallowlist-admin (CLAUDE.md §3.6) — akses admin via SSH tunnel
# (docs/03-operations/observability.md). H5 (keputusan user 2026-09-23): router HANYA di entrypoint
# `admin` (:8443, publish 127.0.0.1 host saja). Di :443 publik host ini tidak punya router → 404
# (hairpin container yang tiba sebagai 10.100.0.1 tidak lagi lolos allowlist).
# Login lokal admin (password acak, observability/secrets/),
# anonymous & sign-up off. SSO Keycloak = belum (keputusan Lead berikutnya).
http:
  routers:
    grafana:
      entryPoints: [admin]
      rule: "Host(`grafana.bimacreative.tech`)"
      middlewares: [crowdsec, ipallowlist-admin, security-headers, ratelimit-default]
      service: grafana
      tls:
        certResolver: le-http   # sertifikat sudah ada; pembaruan HTTP-01 lewat entrypoint `web`

  services:
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
