# T06 — Keycloak auth.bimacreative.tech. DNS pre-check (ADR 0002 #5) lulus 2026-09-23:
# A = 31.97.50.221 (@apollo.dns-parking.com, @1.1.1.1, @8.8.8.8), tanpa AAAA.
#
# Paparan path mengikuti docs Keycloak 26.7.4 guides/server/reverseproxy.adoc §Exposed path
# recommendations: publik HANYA /realms/, /resources/, /.well-known/. /admin/ (console + Admin
# REST API /admin/realms/...) dan /realms/master/ (realm administratif) = internal.
# H5 (keputusan user 2026-09-23): path internal HANYA di entrypoint `admin` (:8443, publish 127.0.0.1
# host saja); di :443 publik /admin* & /realms/master/* → 403 (auth-admin-deny), sisanya tanpa router → 404.
# Alasan: hairpin dari container mana pun ke IP publik :443 tiba sebagai 10.100.0.1 (gateway `proxy`,
# userland-proxy=false) sehingga dulu lolos ipallowlist-admin.
# Health/metrics ada di management port 9000 yang tidak di-route sama sekali.
http:
  routers:
    # ---- Entrypoint `admin` (H5, 127.0.0.1:8443 host saja — SSH tunnel) ----------------------------
    # Admin console + Admin REST API + realm master. KC_HOSTNAME_ADMIN & frontendUrl realm master = :8443.
    # ipallowlist-admin tetap dipasang (defense-in-depth): lewat loopback host koneksi tiba sebagai
    # 10.100.0.1; container yang menghubungi traefik:8443 langsung membawa IP-nya sendiri → 403.
    auth-admin:
      entryPoints: [admin]
      rule: "Host(`auth.bimacreative.tech`) && (PathPrefix(`/admin`) || PathPrefix(`/realms/master/`))"
      priority: 100
      middlewares: [crowdsec, ipallowlist-admin, auth-security-headers, ratelimit-default]
      service: keycloak
      tls:
        certResolver: le-http   # sertifikat sudah ada di acme.json; pembaruan HTTP-01 lewat entrypoint `web`
    # Semua path lain di host ini lewat :8443 (/, /resources/, /realms/<realm lain>/ untuk admin console,
    # token automation, …) → tetap allowlist.
    auth-other:
      entryPoints: [admin]
      rule: "Host(`auth.bimacreative.tech`)"
      priority: 1
      middlewares: [crowdsec, ipallowlist-admin, auth-security-headers, ratelimit-default]
      service: keycloak
      tls:
        certResolver: le-http

    # ---- Entrypoint `websecure` (publik :443) --------------------------------------------------------
    # H5: /admin* & /realms/master/* DITOLAK untuk SEMUA IP di :443 (termasuk hairpin container yang tiba
    # sebagai 10.100.0.1). Prioritas 110 > auth-drms-token (95) / auth-login (90) / auth-public (50) — tanpa
    # router ini /realms/master/ akan cocok dengan auth-public. Pengecualian SATU-SATUNYA: router
    # drms-kc-admin-* (prioritas 120, clients/drms-proyekkas-kc-admin.yml; ClientIP network internal DRMS).
    # Path di luar /realms/, /resources/, /.well-known/ tidak punya router di :443 → 404 Traefik.
    auth-admin-deny:
      entryPoints: [websecure]
      rule: "Host(`auth.bimacreative.tech`) && (PathPrefix(`/admin`) || PathPrefix(`/realms/master/`))"
      priority: 110
      middlewares: [crowdsec, deny-all]
      service: deny-sink   # middlewares/deny-all.yml — backend tidak ada (502 bila deny-all terlepas)
      tls:
        certResolver: le-http
    # Alur login & token (brute force): rate limit ketat per IP.
    auth-login:
      entryPoints: [websecure]
      rule: "Host(`auth.bimacreative.tech`) && (PathRegexp(`^/realms/[^/]+/login-actions/`) || PathRegexp(`^/realms/[^/]+/protocol/openid-connect/(auth|token)$`))"
      priority: 90
      middlewares: [crowdsec, auth-security-headers, ratelimit-login]
      service: keycloak
      tls:
        certResolver: le-http
    # Endpoint publik lain yang dibutuhkan OIDC (discovery, certs/JWKS, userinfo, logout, aset).
    auth-public:
      entryPoints: [websecure]
      rule: "Host(`auth.bimacreative.tech`) && (PathPrefix(`/realms/`) || PathPrefix(`/resources/`) || PathPrefix(`/.well-known/`))"
      priority: 50
      middlewares: [crowdsec, auth-security-headers, ratelimit-default]
      service: keycloak
      tls:
        certResolver: le-http

  middlewares:
    # Varian security-headers untuk Keycloak: TANPA frameDeny/X-Frame-Options DENY — Keycloak
    # mengatur X-Frame-Options SAMEORIGIN + CSP frame-ancestors 'self' per realm, dan admin console
    # memakai iframe same-origin (login-status-iframe). Header lain sama dengan `security-headers`.
    auth-security-headers:
      headers:
        stsSeconds: 300              # tetap pendek; dinaikkan Lead setelah QA (sama dgn security-headers)
        stsIncludeSubdomains: false
        stsPreload: false
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

  services:
    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"
