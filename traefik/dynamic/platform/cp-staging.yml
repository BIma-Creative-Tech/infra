# T16b — Control plane STAGING cp.staging.bimacreative.tech → container `control-plane-staging:3000`
# (network proxy). Stack: /opt/infra/staging/control-plane (docs/03-operations/control-plane.md §Staging).
# Salinan cp.yml (prod) dengan host staging — perubahan router/middleware di cp.yml juga diterapkan di sini.
# DNS pre-check (ADR 0002 #5) lulus 2026-09-23: A = 31.97.50.221 (@apollo/@athena.dns-parking.com,
# @1.1.1.1, @8.8.8.8), tanpa AAAA (wildcard *.staging).
#
# CSP TIDAK diset di Traefik: aplikasi (src/proxy.ts) mengirim CSP dengan nonce per request.
# Alasan pemisahan router ratelimit-login: lihat komentar di cp.yml (H3).
http:
  routers:
    # H3: ratelimit-login HANYA untuk endpoint Auth.js yang memulai/menyelesaikan login:
    #   /api/auth/signin*   — mulai alur OIDC (state/PKCE/nonce cookie + redirect ke Keycloak)
    #   /api/auth/callback* — tukar authorization code → token (request keluar ke Keycloak = amplifikasi)
    # PathPrefix sengaja longgar (mis. `/api/auth/signinX`) — salah cocok hanya membuat limit lebih ketat.
    # /api/auth/{session,csrf,providers,signout} → router `cp-staging` (ratelimit-default): `session` dipanggil
    # klien saat navigasi/refresh; `csrf` hanya token HMAC tanpa state server & tanpa kredensial (provider
    # satu-satunya = Keycloak OIDC, tidak ada Credentials provider) → tidak ada permukaan brute-force.
    # Brute-force password ditangani di Keycloak (ratelimit-login /login-actions + brute force detection).
    cp-staging-auth:
      entryPoints: [websecure]
      rule: "Host(`cp.staging.bimacreative.tech`) && (PathPrefix(`/api/auth/signin`) || PathPrefix(`/api/auth/callback`))"
      priority: 100
      middlewares: [crowdsec, security-headers, ratelimit-login]
      service: control-plane-staging
      tls:
        certResolver: le-http
    # Tombol "Masuk" di /login = Server Action (src/app/actions.ts loginAction → signIn server-side):
    # POST /login, BUKAN /api/auth/signin → setara signin, diberi limit yang sama.
    cp-staging-login-action:
      entryPoints: [websecure]
      rule: "Host(`cp.staging.bimacreative.tech`) && Path(`/login`) && Method(`POST`)"
      priority: 90
      middlewares: [crowdsec, security-headers, ratelimit-login]
      service: control-plane-staging
      tls:
        certResolver: le-http
    cp-staging:
      entryPoints: [websecure]
      rule: "Host(`cp.staging.bimacreative.tech`)"
      priority: 1
      middlewares: [crowdsec, security-headers, ratelimit-default]
      service: control-plane-staging
      tls:
        certResolver: le-http

  services:
    control-plane-staging:
      loadBalancer:
        servers:
          - url: "http://control-plane-staging:3000"
