# T14a — Uptime Kuma 2.5.5 di status.bimacreative.tech → container `uptime-kuma:3001` (network proxy).
# DNS pre-check (ADR 0002 #5) lulus 2026-09-23: A = 31.97.50.221 (@apollo.dns-parking.com, @1.1.1.1,
# @8.8.8.8), tanpa AAAA. Sertifikat production untuk host ini SUDAH ada di acme.json (diterbitkan
# T03/T05 lewat staging → production) → langsung le-http, tidak ada order ACME baru.
#
# Paparan path diverifikasi dari source image 2.5.5 (server/server.js, server/routers/status-page-router.js,
# src/router.js, src/mixins/socket.js `noSocketIOPages`): halaman status publik (/status*, /status-page)
# hanya memakai REST /api/status-page/* + aset statis, TIDAK membuka socket.io. Dashboard/admin/login/
# setup berjalan lewat /socket.io/ + rute SPA (/dashboard, /settings, /setup, /manage-status-page, …)
# → semua yang bukan daftar publik di bawah = ipallowlist-admin (router catch-all prioritas terendah).
http:
  routers:
    # Halaman status publik + API read-only-nya + aset statis.
    status-public:
      entryPoints: [websecure]
      rule: "Host(`status.bimacreative.tech`) && (Path(`/`) || PathPrefix(`/status`) || PathPrefix(`/api/status-page/`) || Path(`/api/entry-page`) || PathPrefix(`/assets/`) || PathPrefix(`/upload/`) || Path(`/favicon.ico`) || Path(`/icon.svg`) || Path(`/icon.png`) || Path(`/icon-192x192.png`) || Path(`/icon-512x512.png`) || Path(`/apple-touch-icon.png`) || Path(`/manifest.json`) || Path(`/serviceWorker.js`) || Path(`/robots.txt`))"
      priority: 50
      middlewares: [crowdsec, security-headers, ratelimit-default]
      service: uptime-kuma
      tls:
        certResolver: le-http
    # Semua path lain (dashboard, /socket.io/, /setup, /settings, /metrics, /api/push, /api/badge, …).
    status-admin:
      entryPoints: [websecure]
      rule: "Host(`status.bimacreative.tech`)"
      priority: 1
      middlewares: [crowdsec, ipallowlist-admin, security-headers, ratelimit-default]
      service: uptime-kuma
      tls:
        certResolver: le-http

  services:
    uptime-kuma:
      loadBalancer:
        servers:
          - url: "http://uptime-kuma:3001"
