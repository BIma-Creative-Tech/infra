# ProyekKas (client DRMS, Payload CMS) — middleware bersama router staging & prod (router prod: drms-proyekkas-prod.yml, E10).
# BUKAN hasil render-client-route.sh (bukan tenant Odoo) — edit manual, lalu HUP (subdirektori
# dynamic/ tidak di-watch: docs/03-operations/traefik.md §Start/stop/reload).
# Desain: /opt/src/proyekkas/docs/proyekkas/architecture.md §3.3, §6.5; ADR ProyekKas 0003/0004.
# Opsi diverifikasi dari docs v3.7 reference/routing-configuration/http/middlewares/
# {ratelimit,buffering,headers}.md (raw.githubusercontent.com/traefik/traefik/v3.7, 2026-09-23).
http:
  middlewares:
    # /api/v1 (APK + custom view admin). Per IP sumber (default sourceCriterion = remote address).
    # 20 req/s rata-rata, burst 40 = ESTIMASI arsitektur §6.5: satu IP NAT operator seluler bisa
    # mewakili banyak perangkat staf; limit per user/perangkat ada di aplikasi (token bucket).
    ratelimit-pk-api:
      rateLimit:
        average: 20
        period: 1s
        burst: 40

    # Batas ukuran body request 10 MiB = crowdsecAppsecBodyLimit (middlewares/crowdsec.yml) dan
    # upload.limits.requestSizeLimit Payload (ADR ProyekKas 0004). Lebih besar → 413 dari Traefik.
    # HANYA di router yang menerima upload (drms-pk-*-api-v1, drms-pk-*-api-rest), TIDAK di router
    # catch-all web: buffering juga membuffer RESPONSE (memResponseBodyBytes default 1 MiB, sisanya ke
    # disk = tmpfs /tmp container traefik, dihitung ke mem_limit 256m).
    # maxResponseBodyBytes (docs v3.7 buffering.md: default 0 = tanpa batas; lebih besar → 500 ke klien)
    # di-set eksplisit 16 MiB = plafon per response yang dibuffer. Response terbesar yang diharapkan:
    # lampiran PDF ≤ 5 MB, foto ≤ ~0.5 MB (ADR ProyekKas 0004 §2/§5); PDF/Excel laporan via /api/v1 =
    # ESTIMASI belum diukur — ekspor > 16 MiB akan 500 (ukur di F1/F6, naikkan bila perlu).
    buffering-pk:
      buffering:
        maxRequestBodyBytes: 10485760
        maxResponseBodyBytes: 16777216

    # Hapus header Authorization di luar /api/v1 (arsitektur §6.1): token Bearer APK tidak boleh
    # dipakai ke REST generik Payload /api/<slug>. Nilai "" = "Removes" (docs headers.md
    # customRequestHeaders; pola sama dengan middlewares/strip-odoo-db-headers.yml).
    strip-authorization:
      headers:
        customRequestHeaders:
          Authorization: ""
