# ROUTER UJI T03 — status.bimacreative.tech → whoami. Sertifikat: CA PRODUCTION le-http sejak
# 2026-09-23 (T05/T06, keputusan Lead #3; staging terbukti lebih dulu).
# DNS pre-check (ADR 0002 #5) lulus 2026-09-23: A status = 31.97.50.221 (@1.1.1.1, @8.8.8.8), tanpa AAAA.
# HAPUS file ini saat T14 menambah dynamic/platform/status.yml (Uptime Kuma) — dua router untuk
# Host yang sama akan bentrok.
http:
  routers:
    test-status-whoami:
      entryPoints:
        - websecure
      rule: "Host(`status.bimacreative.tech`)"
      middlewares:
        - crowdsec            # T05: ban IP + AppSec (paling depan)
        - security-headers
        - ratelimit-default
        - strip-odoo-db-headers
      service: test-whoami
      tls:
        certResolver: le-http
  services:
    test-whoami:
      loadBalancer:
        servers:
          - url: "http://whoami:8080"
