# Middleware `crowdsec` — plugin crowdsec-bouncer-traefik-plugin v1.7.1 (T05).
# Opsi diverifikasi dari README tag v1.7.1 (github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin).
# Pasang PALING DEPAN di rantai middleware router publik (blok sebelum header/ratelimit).
#
# IP klien: tanpa forwardedHeadersTrustedIPs → plugin memakai RemoteAddr koneksi (pkg/ip
# GetRemoteIP), X-Forwarded-For dari klien TIDAK dipakai (diuji, docs/03-operations/crowdsec.md).
http:
  middlewares:
    crowdsec:
      plugin:
        bouncer:
          enabled: true
          logLevel: INFO
          # stream: cache lokal daftar ban, sinkron ke LAPI tiap updateIntervalSeconds.
          crowdsecMode: stream
          updateIntervalSeconds: 30
          # Toleransi 2 kegagalan sinkron berturut-turut (±60–90 s, mis. saat restart crowdsec)
          # sebelum fail-closed (semua request 403). Ban yang sudah di-cache tetap berlaku.
          updateMaxFailure: 2
          streamStartupBlock: true
          crowdsecLapiScheme: http
          crowdsecLapiHost: crowdsec:8080
          # Key dari `cscli bouncers add traefik-bouncer` (file 600, traefik/secrets/, tidak di git).
          crowdsecLapiKeyFile: /etc/traefik/secrets/crowdsec-bouncer.key
          # AppSec (WAF, ADR 0001) — key AppSec default = key LAPI.
          crowdsecAppsecEnabled: true
          crowdsecAppsecHost: crowdsec:7422
          crowdsecAppsecPath: "/"
          crowdsecAppsecFailureBlock: true
          crowdsecAppsecUnreachableBlock: true
          crowdsecAppsecBodyLimit: 10485760
          remediationStatusCode: 403
          httpTimeoutSeconds: 10
