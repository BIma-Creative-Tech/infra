# 2026-10-19: snapshot SQLite 9router yang konsisten sebelum backup restic (/opt/9router/sqlite-snapshot.sh).
# Prefix "-": gagal snapshot TIDAK membatalkan backup platform (pg_dump dsb.); kegagalan tercatat di journal
# (`journalctl -t 9router-snapshot`) dan snapshot sebelumnya tetap ikut ter-backup.
[Service]
ExecStartPre=-/opt/9router/sqlite-snapshot.sh
