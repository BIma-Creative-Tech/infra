# T04 — Postgres 16 shared cluster (plan 02, ADR 0001 pin, ADR 0004 sizing).
# Jalankan scripts/bootstrap.sh sekali sebelum `docker compose up -d` (membuat network `db-*`
# dan .env berisi password acak). Role/DB dibuat oleh scripts/init-roles.sh (idempoten).
# Tidak ada port yang di-publish ke host — setiap konsumen terhubung lewat network external `db-<konsumen>` miliknya
# sendiri (ADR 0010, plan 06 §3.2; anggota hanya postgres + konsumen). Konsumen baru: bootstrap.sh (network) +
# `docker network connect <net> postgres` (live, tanpa recreate) + entri di bawah + baris conf/pg_hba.conf.
name: postgres

services:
  postgres:
    # ADR 0001: postgres:16.15-bookworm (+ digest index multi-arch, diambil 2026-09-23)
    image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    # Non-root: uid/gid `postgres` di image (999). Entrypoint tidak perlu chown/gosu
    # karena volume sudah dimiliki 999 → tidak butuh capability apa pun (diuji, lihat docs/03-operations/postgres.md).
    user: "999:999"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set di .env (scripts/bootstrap.sh)}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer --data-checksums"
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - listen_addresses=*
      - -c
      - password_encryption=scram-sha-256
      # Tuning ADR 0004 §2 (ESTIMASI — revisi setelah `docker stats` nyata, T07)
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=6MB
      # 150 → 200 (2026-09-23, ProyekKas DRMS): jumlah CONNECTION LIMIT role = 176 (ADR 0004 riwayat revisi).
      - -c
      - max_connections=200
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    read_only: true
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0775
      - /tmp:uid=999,gid=999,mode=1777
    shm_size: 256mb
    networks:
      - db-keycloak       # 10.100.20.0/24 — keycloak
      - db-odoo-pool-a    # 10.100.21.0/24 — odoo-pool-a
      - db-odoo-staging   # 10.100.22.0/24 — odoo-staging
      - db-cp             # 10.100.23.0/24 — control-plane (+worker, migrate)
      - db-cp-stg         # 10.100.24.0/24 — control-plane-staging (+worker, migrate)
      - db-drms-stg       # 10.100.26.0/24 — drms-pk-stg (+worker, migrate, seed)
      - db-drms           # 10.100.25.0/24 — drms-pk-web (+worker, migrate, seed) — PROD (E10)
      - db-umami          # 10.100.28.0/24 — umami (plan 11, ADR 0013)
      - db-datamart       # 10.100.27.0/24 — dbt runner datamart (ADR 0016)
      - db-erajaya-stg    # 10.100.29.0/24 — erajaya-staging-web (erajaya-loyalty STAGING)
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "/var/run/postgresql"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2048m
    cpus: 1.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: postgres_pgdata

networks:
  # Semua dibuat oleh scripts/bootstrap.sh: bridge --internal (tanpa egress), subnet tetap (plan 06 §3.2).
  db-keycloak:
    external: true
    name: db-keycloak
  db-odoo-pool-a:
    external: true
    name: db-odoo-pool-a
  db-odoo-staging:
    external: true
    name: db-odoo-staging
  db-cp:
    external: true
    name: db-cp
  db-cp-stg:
    external: true
    name: db-cp-stg
  db-drms-stg:
    external: true
    name: db-drms-stg
  db-drms:
    # E10 ProyekKas DRMS prod. Live: bootstrap.sh + `docker network connect db-drms postgres` (tanpa recreate).
    external: true
    name: db-drms
  db-umami:
    external: true
    name: db-umami
  db-datamart:
    # ADR 0016. Live: bootstrap.sh + `docker network connect db-datamart postgres` (tanpa recreate).
    external: true
    name: db-datamart
  db-erajaya-stg:
    # erajaya-loyalty STAGING. Live: network create + `docker network connect db-erajaya-stg postgres` (tanpa recreate)
    # → compose `--dry-run` menandai Recreate (drift) sampai recreate terjadwal berikutnya.
    external: true
    name: db-erajaya-stg
