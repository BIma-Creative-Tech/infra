# Template router Traefik untuk SATU tenant Odoo (T10; ADR 0003 D1, plan 02 §4).
# JANGAN edit hasil render di traefik/dynamic/clients/ secara manual — render ulang dengan
#   /opt/infra/scripts/render-client-route.sh <slug> <env> [--host <fqdn>]
# Placeholder (divalidasi regex oleh skrip sebelum substitusi):
#   __ROUTE__  odoo-<slug>-<env>          __HOST__  FQDN tenant (DNS pre-check lulus)
#   __DB__     <slug '-'→'_'>_<env>        __POOL__  odoo-pool-a | odoo-staging
#   __SLUG__ / __ENV__ / __GENERATED__   hanya untuk komentar
#
# Tenant: slug=__SLUG__ env=__ENV__ db=__DB__ pool=__POOL__ (dirender __GENERATED__)
#
# Urutan middleware (router ke Odoo): crowdsec (paling depan) [→ ipallowlist-admin] → odoo-security-headers →
# ratelimit-default [→ ratelimit-login | ratelimit-oidc] → strip-odoo-db-headers → __ROUTE__-db (set header eksak).
# Router deny (__ROUTE__-dbmanager-deny): crowdsec → deny-all → deny-sink.
# Service: __POOL__-http (:8069) / __POOL__-ws (:8072), didefinisikan di dynamic/platform/odoo-pools.yml.
http:
  routers:
    # Database manager/selector (/web/database*): TIDAK PERNAH lewat :443 publik (H5b, 2026-09-23).
    # Dulu ipallowlist-admin di websecure — hairpin dari container mana pun ke IP publik :443 tiba sebagai
    # 10.100.0.1 (gateway `proxy`) dan lolos. Kini websecure → deny-all (403) → deny-sink (tidak pernah tercapai,
    # 502 bila deny-all terlepas); pola sama dengan auth-admin-deny (dynamic/platform/auth.yml).
    # Lapisan tambahan saja: Odoo list_db=False tetap menolak DB manager ("disabled by the administrator").
    __ROUTE__-dbmanager-deny:
      entryPoints: [websecure]
      rule: "Host(`__HOST__`) && PathPrefix(`/web/database`)"
      priority: 300
      middlewares: [crowdsec, deny-all]
      service: deny-sink   # middlewares/deny-all.yml
      tls:
        certResolver: le-http
    # Operator: HANYA entrypoint `admin` (127.0.0.1:8443 host, SSH tunnel) →
    #   https://__HOST__:8443/web/database/... ; ipallowlist-admin tetap (defense-in-depth: container yang
    #   menghubungi traefik:8443 langsung membawa IP-nya sendiri → 403). Hanya path /web/database* yang di-route
    #   di :8443 (aset /web/static/* → 404 di :8443). Sertifikat sama dengan router :443 (HTTP-01 via `web`).
    __ROUTE__-dbmanager:
      entryPoints: [admin]
      rule: "Host(`__HOST__`) && PathPrefix(`/web/database`)"
      priority: 300
      middlewares: [crowdsec, ipallowlist-admin, odoo-security-headers, ratelimit-default, strip-odoo-db-headers, __ROUTE__-db]
      service: __POOL__-http
      tls:
        certResolver: le-http
    # Websocket/bus → gevent :8072. Header DB yang sama dengan router utama.
    __ROUTE__-websocket:
      entryPoints: [websecure]
      rule: "Host(`__HOST__`) && PathPrefix(`/websocket`)"
      priority: 200
      middlewares: [crowdsec, odoo-security-headers, ratelimit-default, strip-odoo-db-headers, __ROUTE__-db]
      service: __POOL__-ws
      tls:
        certResolver: le-http
    # Endpoint autentikasi (form login, JSON-RPC session/authenticate, reset password, signup).
    __ROUTE__-login:
      entryPoints: [websecure]
      rule: "Host(`__HOST__`) && (Path(`/web/login`) || Path(`/web/session/authenticate`) || PathPrefix(`/web/reset_password`) || PathPrefix(`/web/signup`))"
      priority: 200
      middlewares: [crowdsec, odoo-security-headers, ratelimit-default, ratelimit-login, strip-odoo-db-headers, __ROUTE__-db]
      service: __POOL__-http
      tls:
        certResolver: le-http
    # SSO sh_auth_oidc (plan 04 S3, F9/AC-S7): /sh_auth_oidc/authorize (303 → Keycloak) & /sh_auth_oidc/callback
    # (303 → /web; memicu 1 exchange token back-channel). Header DB sama dengan router utama; rate limit per IP
    # tersendiri `ratelimit-oidc` (middlewares/ratelimit.yml) di samping ratelimit-default.
    __ROUTE__-oidc:
      entryPoints: [websecure]
      rule: "Host(`__HOST__`) && PathPrefix(`/sh_auth_oidc/`)"
      priority: 200
      middlewares: [crowdsec, odoo-security-headers, ratelimit-default, ratelimit-oidc, strip-odoo-db-headers, __ROUTE__-db]
      service: __POOL__-http
      tls:
        certResolver: le-http
    __ROUTE__:
      entryPoints: [websecure]
      rule: "Host(`__HOST__`)"
      priority: 100
      middlewares: [crowdsec, odoo-security-headers, ratelimit-default, strip-odoo-db-headers, __ROUTE__-db]
      service: __POOL__-http
      tls:
        certResolver: le-http

  middlewares:
    # Nama DB EKSAK untuk sh_dbfilter_header (menimpa nilai dari client) + hapus header bawaan
    # Odoo 19 X-Odoo-Database ("" = hapus, docs v3.7 middlewares/headers.md).
    __ROUTE__-db:
      headers:
        customRequestHeaders:
          X-Sh-Odoo-Db: "__DB__"
          X-Odoo-Database: ""
