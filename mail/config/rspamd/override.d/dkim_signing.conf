# T11 — DKIM signing multi-domain (ADR 0005 #11). Disalin scripts/bootstrap.sh ke
# data/config/rspamd/override.d/ → DMS menyalin ke /etc/rspamd/override.d/ (change detection memantau
# /tmp/docker-mailserver/rspamd/** → reload Rspamd otomatis, docs DMS v16.0.1 config/security/rspamd.md).
# Basis: default yang ditulis `setup config dkim` (target/bin/rspamd-dkim v16.0.1) + docs
# config/best-practices/dkim_dmarc_spf.md §"Using Multiple Domains". Opsi & default diverifikasi dari
# /usr/share/rspamd/plugins/dkim_signing.lua + lualib/lua_dkim_tools.lua (Rspamd 4.1.5 di image).
# Kunci privat (data/config/rspamd/dkim/*.private.txt) TIDAK di git (data/ di-ignore); ikut backup restic.

enabled = true;

sign_authenticated = true;
sign_local = false;
try_fallback = false;          # domain tanpa blok di bawah → TIDAK ditandatangani

use_domain = "header";         # domain penanda = domain header From
use_redis = false;
use_esld = true;

# BERBEDA dari default DMS (true): user terautentikasi hanya boleh menghasilkan tanda tangan untuk domain
# akunnya sendiri. Tanpa ini, mailbox domain A bisa mengirim `From: x@<domain-client-B>` (SPOOF_PROTECTION
# Postfix hanya memeriksa envelope sender) dan Rspamd menandatanganinya dengan kunci B → spoof lintas tenant
# yang lolos DKIM/DMARC. (lua_dkim_tools.lua: `if auser and not settings.allow_username_mismatch` → domain
# user harus = domain penanda, selain itu tidak ditandatangani.)
allow_username_mismatch = false;

# check_pubkey: Rspamd mencocokkan kunci privat dengan TXT <selector>._domainkey.<domain>; mismatch/absen
# dicatat di /var/log/mail/rspamd.log. allow_pubkey_mismatch = true (default plugin) → tetap menandatangani
# walau TXT belum dipublikasikan / berbeda (hanya log) — agar uji lokal jalan sebelum user mengisi DNS.
check_pubkey = true;
allow_pubkey_mismatch = true;

domain {
    bimacreative.tech {
        path = "/tmp/docker-mailserver/rspamd/dkim/rsa-2048-mail-bimacreative.tech.private.txt";
        selector = "mail";
    }
    # Domain client — AKTIFKAN hanya saat onboarding (docs/03-operations/mail.md §Menambah domain client):
    # expomedia.id {
    #     path = "/tmp/docker-mailserver/rspamd/dkim/rsa-2048-mail-expomedia.id.private.txt";
    #     selector = "mail";
    # }
}
