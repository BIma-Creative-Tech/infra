# T11 — rate limit OUTBOUND per mailbox & per domain pengirim (ADR 0005 #13).
# Modul: Rspamd ratelimit (docs https://docs.rspamd.com/modules/ratelimit/, source plugins/ratelimit.lua
# Rspamd 4.1.5 di image). Diinclude di dalam blok `ratelimit { }` (modules.d/ratelimit.conf, prioritas 10).
# Redis: opsi `servers` tidak diset → pakai setelan Redis global ("global settings used if not set"); DMS
# (ENABLE_RSPAMD_REDIS=1) menulis local.d/redis.conf `servers = "127.0.0.1:6379"` (setup.d/security/rspamd.sh).
# Butuh RSPAMD_CHECK_AUTHENTICATED=1 (compose): default DMS settings.conf `authenticated { groups_enabled = [dkim] }`
# mematikan semua simbol lain (termasuk ratelimit) untuk user terautentikasi.
#
# Semantik token bucket: `burst` = kapasitas; `rate` = pengisian ulang. Tiap PENERIMA memakai 1 token
# (tanpa skip_recipients). Melebihi → soft reject (4xx, klien/MTA mencoba ulang), dicatat di rspamd.log.
# Nilai = batas awal konservatif (ADR 0005 #13: "mis. 30/jam burst 10" & "per domain mis. 200/jam") —
# dinaikkan per plan subscription (override per mailbox belum ada; control plane kelak).

whitelisted_rcpts = "postmaster,mailer-daemon";   # default modul (modules.d/ratelimit.conf), ditulis eksplisit

rates {
    # Per mailbox terautentikasi (selector `user` = task:get_user(); nil untuk mail masuk tanpa AUTH → dilewati).
    mailbox_outbound = {
        selector = "user.lower";
        bucket = {
            burst = 10;
            rate = "30 / 1h";
        }
    }
    # Per domain akun terautentikasi (bagian setelah '@' dari login SASL = alamat mailbox).
    # transform `regexp` mengembalikan [match penuh, grup 1] → `last` = domain (lua_selectors/transforms.lua).
    domain_outbound = {
        selector = "user.lower.regexp('@([^@]+)$').last";
        bucket = {
            burst = 50;
            rate = "200 / 1h";
        }
    }
}
