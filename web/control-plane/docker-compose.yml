# T16a — Control plane PROD (cp.bimacreative.tech), dikelola dari /opt/infra (CLAUDE.md §3.1).
# Image dibangun LOKAL dari repo /opt/src/control-plane (commit `main`), tag = short SHA commit:
#   cd /opt/src/control-plane && git archive --format=tar main \
#     | docker build -t control-plane:$(git rev-parse --short=7 main) \
#         --label org.opencontainers.image.revision=$(git rev-parse main) -
# Deploy/upgrade/rollback: docs/03-operations/control-plane.md.
# Tidak ada port di-publish ke host; Traefik → http://control-plane:3000 (network proxy,
# router traefik/dynamic/platform/cp.yml). Secret di .env (600, di-ignore git).
name: web-control-plane

x-hardening: &hardening
  # Tag pin (short SHA commit main repo control-plane). Override sementara untuk rollback:
  #   CONTROL_PLANE_TAG=<tag-lama> docker compose up -d   (lihat docs)
  image: control-plane:${CONTROL_PLANE_TAG:-8b0bf5e}   # v0.7.0 isu link dokumen (Lacak Dokumen) (2026-10-02; rollback 0def3c7 — tanpa migrasi baru)
  env_file:
    - .env
  user: "1001:1001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # One-shot: menerapkan migrasi drizzle (idempoten). web & worker baru dibuat setelah migrasi
  # sukses (depends_on service_completed_successfully) → `docker compose up -d` selalu migrasi dulu.
  migrate:
    <<: *hardening
    restart: "no"
    command: ["node", "dist/db/migrate.mjs"]
    environment:
      SERVICE_NAME: control-plane-migrate
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=0700
    networks:
      - db-cp   # ADR 0010: network DB per konsumen (10.100.23.0/24, --internal)
    healthcheck:
      disable: true
    mem_limit: 256m
    cpus: 0.25

  web:
    <<: *hardening
    container_name: control-plane
    # ADR 0016: DATAMART_URL (role datamart_reader, secret) + DATAMART_ENV=prod hanya untuk web — bukan worker/migrate.
    env_file:
      - .env
      - .env.datamart
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: control-plane-web
      INFRA_JOBS_INSTANCE: prod   # plan 05 / ADR 0009
      # plan 15: tombol "Buka Odoo" Quotation Tracker (bukan secret).
      DASHBOARD_ODOO_URLS: expomedia=https://erp.expomedia.id
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=0700
      - /app/.next/cache:uid=1001,gid=1001,mode=0700
    networks:
      - db-cp   # → postgres:5432 (ADR 0010: network DB per konsumen, 10.100.23.0/24)
      - proxy   # Traefik → control-plane:3000 + egress ke https://auth.bimacreative.tech (issuer)
    healthcheck:
      # sama dengan HEALTHCHECK di Dockerfile repo control-plane
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 384m   # ADR 0004
    cpus: 0.5

  worker:
    <<: *hardening
    container_name: control-plane-worker
    # Plan 05 J6 (ADR 0009): uid khusus cpjob-prod 950 (BUKAN 1001 = user host `deploy`) — hanya uid ini yang bisa
    # menulis spool infra-job prod (spool/new root:cpjob-prod 0730, tmp cpjob-prod 0700).
    user: "950:950"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/worker/index.mjs"]
    environment:
      SERVICE_NAME: control-plane-worker
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      INFRA_JOBS_INSTANCE: prod
      INFRA_JOBS_SPOOL_DIR: /jobs/spool
      INFRA_JOBS_RESULTS_DIR: /jobs/results
    tmpfs:
      - /tmp:uid=950,gid=950,mode=0700
    volumes:
      # Spool rw (worker menulis tmp/ lalu rename ke new/) + hasil ro — dikelola role Ansible infra_jobs.
      - type: bind
        source: /var/lib/infra-jobs/prod/spool
        target: /jobs/spool
        bind: { create_host_path: false }
      - type: bind
        source: /var/lib/infra-jobs/prod/results
        target: /jobs/results
        read_only: true
        bind: { create_host_path: false }
    networks:
      - db-cp   # hanya DB; tidak butuh egress
    healthcheck:
      test: ["CMD", "node", "-e", "const t=+require('fs').readFileSync('/tmp/worker-heartbeat','utf8');process.exit(Date.now()-t<60000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m   # ADR 0004
    cpus: 0.25

networks:
  db-cp:
    # postgres/scripts/bootstrap.sh: 10.100.23.0/24 --internal — anggota hanya postgres + migrate/web/worker stack ini (ADR 0010).
    external: true
    name: db-cp
  proxy:
    external: true
    name: proxy
