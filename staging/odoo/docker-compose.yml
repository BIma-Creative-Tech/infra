# T10 — Odoo CE 19.0 pool shared STAGING (plan 02; ADR 0001 pin, ADR 0003 D1, ADR 0004 §2).
# Jalankan dulu: /opt/infra/scripts/odoo-pool-bootstrap.sh staging  (membuat .env 600 + secrets/).
# DB tenant: /opt/infra/scripts/provision-odoo-db.sh <slug> staging. Router: render-client-route.sh.
# Tidak ada port di-publish: Traefik menjangkau odoo-staging:8069 (HTTP) & :8072 (/websocket) via `odoo-edge-stg`
# (H1 + ADR 0010 #4: network khusus traefik + pool staging; pool TIDAK di `proxy`/`odoo-edge` → pool prod & service lain
# tidak bisa langsung ke Odoo staging, dan sebaliknya).
name: odoo-staging

services:
  odoo:
    # ADR 0001: odoo:19.0-20260908 (+ digest index multi-arch, diverifikasi 2026-09-23
    # `docker buildx imagetools inspect` = hub.docker.com tags API).
    image: odoo:19.0-20260908@sha256:144175ec0039d52daff1d79f7e51c9281ca3c98b96c830feb49d09764a9f5d7c
    container_name: odoo-staging
    hostname: odoo-staging
    restart: unless-stopped
    # uid/gid `odoo` di image (100:101) — non-root.
    user: "100:101"
    env_file:
      - .env        # PGHOST/PGPORT/PGUSER/PGPASSWORD + ODOO_ADMIN_PASSWD (hash) — 600, tidak di git
    environment:
      # Plan 04 / ADR 0008 #4 — sh_auth_oidc >= 19.0.1.2.0: secret client OIDC per DB dibaca dari file
      # $SH_OIDC_SECRET_DIR/<db> (mount ro di bawah; ditulis scripts/provision-odoo-sso.sh, 0440 root:101) saat
      # token exchange → tenant baru / rotasi tanpa restart. Tidak ada secret di env. Issuer (bukan secret) wajib
      # terdaftar agar secret platform dilepas (dipisah koma).
      SH_OIDC_SECRET_DIR: /run/sh-oidc
      SH_OIDC_TRUSTED_ISSUERS: https://auth.bimacreative.tech/realms/platform-staging
      # ADR 0010 #5a / plan 06 §4.2 (D-i-D, sh_dbfilter_header >= 19.0.1.1.0): header X-Sh-Odoo-Db HANYA dipakai bila
      # peer TCP ada di daftar ini (CIDR dipisah koma) = subnet `odoo-edge-stg` (anggota: traefik + pool ini saja). Nilai LITERAL
      # (bukan ${VAR}): nilai kosong/rusak = fail-closed untuk semua tenant. HARUS aktif di recreate yang SAMA dengan
      # perpindahan network pool ini (plan 06 S4) — bila pool masih dijangkau Traefik dari subnet lain, semua tenant 303 →
      # /web/database/selector. Modul < 19.0.1.1.0 mengabaikan env ini. Rollback: hapus baris ini + `docker compose up -d`.
      # ADR 0015: dependensi Python modul platform (httpx, xmlschema) yang tidak ada di image resmi — pure-Python, dipin
      # ber-hash di addons/platform/requirements.txt, dibangun `addons/platform/tools/build-pylib.sh ./pylib` (image sama).
      PYTHONPATH: /mnt/extra-python
      SH_DBFILTER_TRUSTED_PROXIES: "10.100.13.0/24"
    # Entry point image: wait-for-psql.py (PG* dari env) lalu `odoo`. Opsi di odoo.conf.
    command: ["odoo"]
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      # addons/shared = git submodule odoo-addons-shared ter-pin, addons/clients/<slug> = repo client
      # (docs/03-operations/odoo.md §Addons). Satu mount ro untuk seluruh /mnt/extra-addons: image
      # mendeklarasikan VOLUME /mnt/extra-addons → tanpa ini Docker membuat volume anonim writable.
      - ./addons:/mnt/extra-addons:ro
      # filestore + sessions — volume terpisah per pool
      - filestore:/var/lib/odoo
      # pylib (ADR 0015): di luar git (.gitignore), dibangun ulang dari requirements.txt submodule platform.
      - type: bind
        source: ./pylib
        target: /mnt/extra-python
        read_only: true
        bind:
          create_host_path: false
      # secret client OIDC per DB (plan 04): host secrets/oidc (0750 root:101, file 0440, di luar git) → ro.
      # create_host_path: false → `up` gagal bila direktori belum ada (odoo-pool-bootstrap.sh membuatnya dengan
      # mode benar) daripada Docker membuatnya 0755 root:root.
      - type: bind
        source: ./secrets/oidc
        target: /run/sh-oidc
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      # wkhtmltopdf/report & upload sementara. uid odoo.
      - /tmp:uid=100,gid=101,mode=1777,size=512m
    # ADR 0010 (plan 06): DB lewat network per konsumen, edge staging terpisah.
    networks:
      - db-odoo-staging   # → postgres:5432 (internal 10.100.22.0/24; pg_hba role pool hanya dari subnet ini)
      - odoo-edge-stg     # Traefik → :8069/:8072 + egress/hairpin OIDC (non-internal, 10.100.13.0/24)
    healthcheck:
      # /web/health tidak butuh DB/header (README sh_dbfilter_header). curl ada di image.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8069/web/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # ADR 0004 §2: staging 1280 MiB / 1.0 CPU (workers=2, max_cron_threads=1), always-on.
    mem_limit: 1280m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  filestore:
    name: odoo_staging_data

networks:
  db-odoo-staging:
    # postgres/scripts/bootstrap.sh: 10.100.22.0/24 --internal, anggota hanya postgres + pool ini (ADR 0010).
    external: true
    name: db-odoo-staging
  odoo-edge-stg:
    # traefik/scripts/bootstrap.sh: 10.100.13.0/24, anggota: traefik + odoo-staging saja (H1, ADR 0010 #4).
    external: true
    name: odoo-edge-stg
