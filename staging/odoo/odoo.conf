; Odoo CE 19.0 — pool shared STAGING (always-on) (T10, plan 02; ADR 0003 D1, ADR 0004 §2).
; Setiap key diverifikasi di odoo/tools/config.py image odoo:19.0-20260908.
; TIDAK ADA SECRET DI FILE INI (di-commit):
;   - koneksi DB  → env PGHOST/PGPORT/PGUSER/PGPASSWORD (.env 600; config.py env_name=PG*)
;   - admin_passwd (master password, hash pbkdf2_sha512) → env ODOO_ADMIN_PASSWD (.env 600;
;     config.py: opsi file-only mendapat env_name ODOO_<DEST>); plaintext di secrets/master-password.
; Prioritas config.py: runtime > CLI > env > file > default.
[options]
; --- Edge / pemilihan DB -------------------------------------------------------------------
proxy_mode = True
list_db = False
; sh_dbfilter_header: patch odoo.http.db_filter saat load; header X-Sh-Odoo-Db eksak, fail-closed.
server_wide_modules = base,rpc,web,sh_dbfilter_header
; Nama DB = <slug dengan '-'→'_'>_<env>. Slug platform ^[a-z0-9-]{3,30}$ boleh memuat '-',
; sehingga bagian slug = [a-z0-9_]+ (lihat docs/03-operations/odoo.md §Konvensi nama DB).
dbfilter = ^[a-z0-9_]+_staging$
; --- Addons --------------------------------------------------------------------------------
; shared = git submodule odoo-addons-shared (ter-pin), clients/* = satu repo per client (glob
; dievaluasi saat start → tambah client = restart pool). Addons core image ditambahkan otomatis.
addons_path = /mnt/extra-addons/shared,/mnt/extra-addons/clients/*
data_dir = /var/lib/odoo
; --- Server --------------------------------------------------------------------------------
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
; ADR 0004: staging workers=2, max_cron_threads=1.
workers = 2
max_cron_threads = 1
; per proses (bytes): hard 768 MiB (ADR 0004 §2); soft 512 MiB (ESTIMASI, tidak ada di ADR).
limit_memory_soft = 536870912
limit_memory_hard = 805306368
; ESTIMASI (default 60/120; contoh deploy.rst 600/1200 terlalu longgar untuk pool bersama).
limit_time_cpu = 120
limit_time_real = 300
limit_request = 65536
; Koneksi Postgres per proses (default 64). 2 worker + cron + gevent → role CONNECTION LIMIT 24.
db_maxconn = 6
db_template = template0
; --- Log (stdout → docker json-file 10m×3) --------------------------------------------------
log_level = info
logfile =
