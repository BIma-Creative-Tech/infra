# ProyekKas STAGING (client DRMS) — NOT APPLIED by the app team; reviewed and installed by the infra
# Lead at /opt/infra/staging/drms-proyekkas/ (ADR 0002 §3), then `infra-deploy staging/drms-proyekkas`.
# Host: drms-kas.staging.bimacreative.tech → Traefik router file
# /opt/infra/traefik/dynamic/clients/drms-proyekkas-staging.yml → container `drms-pk-stg:3000`.
#
# Hardening per /opt/infra/CLAUDE.md §3.5: read_only + tmpfs, cap_drop ALL, no-new-privileges,
# uid 1001, mem_limit/cpus, healthchecks, json-file 10m×3, no published ports.
# Limits: ADR 0002 §6 web 640m / worker 320m (measured F1 spike g: web peak 205 MiB, worker 51 MiB).
# DB connections: pk_drms_stg_app CONNECTION LIMIT 10 → web pool 5 + worker 3 + seed 2. Pool 1 deadlocks (a
# transaction holds its connection while Payload needs a second one — observed in the F1 image smoke test).
# Secrets: files under ./secrets/ (NOT in git), owned 1001:1001 mode 0400 — Compose (non-swarm)
# ignores uid/gid/mode of file secrets (verified with Compose v5.5.1), so host ownership must fit.
#
# Order: `docker compose run --rm drms-pk-stg-migrate` runs automatically via depends_on;
# seed (idempotent): `docker compose --profile seed run --rm drms-pk-stg-seed`.
# UAT seed (one-off, same service, no Keycloak access needed; see .env.example "UAT seed"):
#   docker compose --profile seed run --rm -e UAT_USERS drms-pk-stg-seed node /app/node_modules/payload/bin.js run src/seed/uat.ts
name: drms-proyekkas-stg

x-hardening: &hardening
  restart: unless-stopped
  user: "1001:1001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-app-env: &app-env
  NODE_ENV: production
  TZ: Asia/Makassar
  APP_URL: ${APP_URL:?}
  OIDC_ISSUER: ${OIDC_ISSUER:?}
  OIDC_WEB_CLIENT_ID: ${OIDC_WEB_CLIENT_ID:-proyekkas-web}
  OIDC_MOBILE_CLIENT_ID: ${OIDC_MOBILE_CLIENT_ID:-proyekkas-mobile}
  # Admin REST via the internal network drms-kc-admin-stg (alias auth.bimacreative.tech → Traefik);
  # kept separate from OIDC_ISSUER on purpose (infra decision 2026-09-23).
  KC_ADMIN_BASE_URL: ${KC_ADMIN_BASE_URL:?}
  KC_REALM: ${KC_REALM:-drms-staging}
  KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID:-proyekkas-admin-api}
  MEDIA_DIR: /data/media
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # F4 Android App Links (/.well-known/assetlinks.json, ADR 0010): APK application id and the SHA-256
  # fingerprint(s) of its signing certificate, comma separated `AA:BB:…`. Empty → `[]` (no App Link).
  ANDROID_APP_PACKAGE: ${ANDROID_APP_PACKAGE:-id.co.drms.proyekkas}
  ANDROID_APP_CERT_SHA256: ${ANDROID_APP_CERT_SHA256:-}
  # F3 rollback switch for Excel exports (write-excel-file): false → Excel buttons hidden, .xlsx → 404.
  EXPORT_XLSX_ENABLED: ${EXPORT_XLSX_ENABLED:-true}
  DATABASE_URL_FILE: /run/secrets/database_url_app
  PAYLOAD_SECRET_FILE: /run/secrets/payload_secret
  OIDC_WEB_CLIENT_SECRET_FILE: /run/secrets/oidc_web_client_secret
  KC_ADMIN_CLIENT_SECRET_FILE: /run/secrets/kc_admin_client_secret
  # Outbound mail (app notifications + admin test mail), all-or-nothing (src/lib/env.ts):
  # mailbox no-reply@bimacreative.tech on mail.bimacreative.tech:587, STARTTLS required,
  # certificate verified; From MUST equal SMTP_USER. Server limit 30 mails/h (burst 10) per
  # mailbox → the app keeps itself at ≤ 29/h, burst 5 (DB bucket, src/email/rate-guard.ts).
  # Egress to :587 via drms-kas-edge (hairpin). Mails are sent by the worker (Jobs queue).
  SMTP_HOST: ${SMTP_HOST:?}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:?}
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ProyekKas}
  SMTP_PASSWORD_FILE: /run/secrets/smtp_password

x-app-secrets: &app-secrets
  - database_url_app
  - payload_secret
  - oidc_web_client_secret
  - kc_admin_client_secret
  - smtp_password

services:
  # One-shot migrations as the OWNER role (ADR 0006 §6). Owner DSN only here.
  drms-pk-stg-migrate:
    <<: *hardening
    image: ${PK_MIGRATE_IMAGE:?}
    container_name: drms-pk-stg-migrate
    restart: "no"
    environment:
      NODE_ENV: production
      TZ: Asia/Makassar
      SERVICE_NAME: drms-pk-stg-migrate
      PK_SKIP_ENV_CHECK: "true"
      DATABASE_POOL_MAX: "2"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL_FILE: /run/secrets/database_url_owner
      PAYLOAD_SECRET_FILE: /run/secrets/payload_secret
    secrets: [database_url_owner, payload_secret]
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=0700
    networks: [db]
    mem_limit: 384m
    cpus: 0.5

  # Web + admin + /api/v1 (Next standalone). Container name fixed by the Traefik service URL.
  drms-pk-stg:
    <<: *hardening
    image: ${PK_WEB_IMAGE:?}
    container_name: drms-pk-stg
    depends_on:
      drms-pk-stg-migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      SERVICE_NAME: drms-pk-stg
      DATABASE_POOL_MAX: "5"
      NODE_OPTIONS: --max-old-space-size=256
    secrets: *app-secrets
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=0700
      - /app/apps/web/.next/cache:uid=1001,gid=1001,mode=0700
    volumes:
      - media:/data/media
    networks: [drms-kas-edge, db, drms-kc-admin-stg]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 384m
    cpus: 0.75

  # Payload Jobs worker outside Next (spike e). Cron evaluated in process TZ → TZ=Asia/Makassar.
  drms-pk-stg-worker:
    <<: *hardening
    image: ${PK_WEB_IMAGE:?}
    container_name: drms-pk-stg-worker
    command: ["node", "apps/web/dist/worker.mjs"]
    depends_on:
      drms-pk-stg-migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      SERVICE_NAME: drms-pk-stg-worker
      DATABASE_POOL_MAX: "3"
      NODE_OPTIONS: --max-old-space-size=128
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      WORKER_INTERVAL_MS: "30000"
    secrets: *app-secrets
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=0700
    volumes:
      - media:/data/media
    # drms-kas-edge: egress (SMTP :587 to mail.bimacreative.tech, FCM/Odoo later); db; Keycloak
    # Admin API network (infra decision).
    networks: [drms-kas-edge, db, drms-kc-admin-stg]
    healthcheck:
      test: ["CMD", "node", "-e", "const t=+require('fs').readFileSync('/tmp/worker-heartbeat','utf8');process.exit(Date.now()-t<90000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 192m
    cpus: 0.25

  # Idempotent seed (APP role, audit source=system). Optional bootstrap admin via
  # SEED_ADMIN_EMAIL + SEED_ADMIN_KEYCLOAK_SUB (an existing user of realm drms-staging).
  # Real master data (optional, never in git): not wired by default because a Compose secret
  # needs its file to exist. To use it, place ./secrets/seed_data.json.secret (chown 1001:1001,
  # chmod 0400), add `seed_data: {file: ./secrets/seed_data.json.secret}` under top-level
  # `secrets:`, append `seed_data` to this service's `secrets:` and set
  # SEED_DATA_FILE=/run/secrets/seed_data in .env. Without it the fictional repo data is used.
  drms-pk-stg-seed:
    <<: *hardening
    image: ${PK_MIGRATE_IMAGE:?}
    container_name: drms-pk-stg-seed
    restart: "no"
    command: ["node", "/app/node_modules/payload/bin.js", "run", "src/seed/index.ts"]
    profiles: ["seed"]
    environment:
      NODE_ENV: production
      TZ: Asia/Makassar
      SERVICE_NAME: drms-pk-stg-seed
      PK_SKIP_ENV_CHECK: "true"
      DATABASE_POOL_MAX: "2"
      MEDIA_DIR: /data/media
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_KEYCLOAK_SUB: ${SEED_ADMIN_KEYCLOAK_SUB:-}
      SEED_DATA_FILE: ${SEED_DATA_FILE:-}
      DATABASE_URL_FILE: /run/secrets/database_url_app
      PAYLOAD_SECRET_FILE: /run/secrets/payload_secret
    secrets: [database_url_app, payload_secret]
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=0700
    volumes:
      - media:/data/media
    networks: [db]
    mem_limit: 384m
    cpus: 0.5

secrets:
  database_url_owner:
    file: ./secrets/database_url_owner.secret
  database_url_app:
    file: ./secrets/database_url_app.secret
  payload_secret:
    file: ./secrets/payload_secret.secret
  oidc_web_client_secret:
    file: ./secrets/oidc_web_client_secret.secret
  kc_admin_client_secret:
    file: ./secrets/kc_admin_client_secret.secret
  smtp_password:
    file: ./secrets/smtp_password.secret

volumes:
  media:
    # exact name used by /opt/infra/scripts/lib/restic-common.sh MEDIA_VOLUMES (backup)
    name: drms_pk_media_stg

networks:
  drms-kas-edge:
    external: true
    name: drms-kas-edge
  db:
    external: true
    name: db
  drms-kc-admin-stg:
    external: true
    name: drms-kc-admin-stg
