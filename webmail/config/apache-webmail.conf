# Override Apache untuk webmail (ADR 0012). Di-mount ro sebagai /etc/apache2/conf-enabled/zz-webmail.conf — conf-enabled
# di-include SETELAH mods-enabled (apache2.conf Debian) → direktif di sini menimpa mpm_prefork.conf (MaxRequestWorkers 150)
# dan security.conf (ServerTokens OS / ServerSignature On) bawaan image.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       12
    MaxConnectionsPerChild  500
</IfModule>
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ServerName webmail.expomedia.id
