# Override Apache webmail instance bimacreative.tech (ADR 0012) — salinan ../../config/apache-webmail.conf, beda ServerName.
# Di-mount ro sebagai /etc/apache2/conf-enabled/zz-webmail.conf (di-include SETELAH mods-enabled → menimpa mpm_prefork.conf).
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       12
    MaxConnectionsPerChild  500
</IfModule>
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ServerName webmail.bimacreative.tech
