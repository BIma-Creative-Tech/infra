---
# Healthcheck infra + alert email (H7, keputusan user 2026-09-23). Idempoten.
# Skrip dijalankan dari repo: {{ infra_root }}/scripts/infra-healthcheck.sh (+ scripts/lib/infra_alert_mail.py).
# Mailbox pengirim dibuat manual SEKALI: mail/scripts/mailbox-add.sh {{ infra_alert_from }} 256M
# (password → {{ infra_root }}/mail/secrets/, tidak di git, tidak di Ansible).
- name: Direktori konfigurasi & state (root 700)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ healthcheck_etc_dir }}"
    - "{{ healthcheck_state_dir }}"

- name: alert.env (penerima/pengirim/SMTP — tanpa secret)
  ansible.builtin.template:
    src: alert.env.j2
    dest: "{{ healthcheck_etc_dir }}/alert.env"
    owner: root
    group: root
    mode: "0600"

- name: Unit systemd healthcheck + notifikasi kegagalan unit
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - infra-healthcheck.service
    - infra-healthcheck.timer
    - infra-unit-failure@.service
  notify: Reload systemd (healthcheck)

- name: Terapkan daemon-reload sebelum mengaktifkan timer
  ansible.builtin.meta: flush_handlers

- name: Timer healthcheck aktif
  ansible.builtin.systemd_service:
    name: infra-healthcheck.timer
    enabled: true
    state: started

- name: Cek file password mailbox pengirim alert
  ansible.builtin.stat:
    path: "{{ infra_root }}/mail/secrets/{{ infra_alert_from }}.password"
  register: healthcheck_pw

- name: Peringatan bila mailbox pengirim belum dibuat (alert hanya ke journal)
  ansible.builtin.debug:
    msg: >-
      PERINGATAN: {{ infra_root }}/mail/secrets/{{ infra_alert_from }}.password tidak ada — jalankan
      mail/scripts/mailbox-add.sh {{ infra_alert_from }} 256M; sampai itu email alert gagal (journal tetap).
  when: not healthcheck_pw.stat.exists
