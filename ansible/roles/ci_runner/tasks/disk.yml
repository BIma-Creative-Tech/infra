---
# R1: ext4 di file loop berukuran TETAP → isi CI tidak bisa memenuhi `/` (kuota keras). Hanya data runner.
# R12 (temuan R10 MEDIUM): file harus TERALOKASI PENUH (bukan sparse) agar `/` tidak ikut tumbuh saat /srv/ci terisi:
#  - mkfs.ext4 `-E nodiscard` (default mke2fs men-discard = punch hole di file loop → hasil fallocate hilang);
#  - opsi mount tanpa `discard` (default ext4) → blok yang dibebaskan di dalam tidak di-punch;
#  - fstrim.timer Ubuntu: `fstrim --listed-in /etc/fstab:/proc/self/mountinfo` memakai file PERTAMA yang tidak kosong
#    (= /etc/fstab) → /srv/ci (unit mount systemd, bukan fstab) tidak di-trim; dicek di bawah (dry-run);
#  - file lama yang sparse diisi (fallocate tanpa -p/-d mengisi hole, data tidak disentuh) — hanya saat runner idle.
- name: Direktori state runner
  ansible.builtin.file:
    path: "{{ ci_runner_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Alokasikan file disk (fallocate, sekali)
  ansible.builtin.command:
    cmd: "fallocate -l {{ ci_runner_disk_size }} {{ ci_runner_disk_image }}"
    creates: "{{ ci_runner_disk_image }}"

- name: Izin file disk
  ansible.builtin.file:
    path: "{{ ci_runner_disk_image }}"
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode

- name: Cek filesystem di file disk
  ansible.builtin.command:
    cmd: "blkid -o value -s TYPE {{ ci_runner_disk_image }}"
  register: ci_runner_disk_fstype
  changed_when: false
  failed_when: false
  check_mode: false

# Hanya bila BELUM ada filesystem sama sekali (blkid kosong) → tidak pernah memformat ulang data yang ada.
- name: mkfs.ext4 (sekali, -m 0, label ci)
  ansible.builtin.command:
    cmd: "mkfs.ext4 -q -F -m 0 -E nodiscard -L {{ ci_runner_disk_label }} {{ ci_runner_disk_image }}"
  when:
    - not ansible_check_mode
    - ci_runner_disk_fstype.stdout | trim == ''

- name: Cek alokasi file disk (sparse?)
  ansible.builtin.stat:
    path: "{{ ci_runner_disk_image }}"
    get_checksum: false
  register: ci_runner_disk_stat

# st_blocks × 512 < ukuran → ada hole. Hanya bila supervisor TIDAK aktif (runner idle; lihat runbook) — mengisi hole
# saat job menulis ke loop aman secara kernel, tapi IO 10–20 GB bersaing dengan job/prod.
- name: Isi hole file disk (fallocate, non-destruktif)
  ansible.builtin.command:
    cmd: "fallocate -l {{ ci_runner_disk_size }} {{ ci_runner_disk_image }}"
  when:
    - not ansible_check_mode
    - ci_runner_disk_stat.stat.exists
    - (ci_runner_disk_stat.stat.blocks | int) * 512 < (ci_runner_disk_stat.stat.size | int)
    - ci_runner_fill_disk_holes | bool

- name: Peringatan file disk masih sparse
  ansible.builtin.debug:
    msg: >-
      {{ ci_runner_disk_image }} sparse: {{ ((ci_runner_disk_stat.stat.blocks | int) * 512 / 1073741824) | round(1) }} GiB
      teralokasi dari {{ ((ci_runner_disk_stat.stat.size | int) / 1073741824) | round(1) }} GiB. Hentikan supervisor saat idle lalu
      jalankan dengan -e ci_runner_fill_disk_holes=true (docs/03-operations/ci-runner.md §Disk).
  when:
    - ci_runner_disk_stat.stat.exists
    - (ci_runner_disk_stat.stat.blocks | int) * 512 < (ci_runner_disk_stat.stat.size | int)
    - not (ci_runner_fill_disk_holes | bool)

# 0700: uid 1001 di host = user `deploy` (bukan runner). Tanpa izin traversal, deploy (atau user host lain) tidak bisa
# membaca/meracuni cache CI. Container tidak terpengaruh (bind mount di-resolve dockerd sebagai root).
- name: Mountpoint
  ansible.builtin.file:
    path: "{{ ci_runner_mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Unit mount {{ ci_runner_mountpoint }}
  ansible.builtin.template:
    src: srv-ci.mount.j2
    dest: "/etc/systemd/system/{{ ci_runner_mountpoint | regex_replace('^/', '') | replace('/', '-') }}.mount"
    owner: root
    group: root
    mode: "0644"
  register: ci_runner_mount_unit

- name: daemon-reload (unit mount)
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ci_runner_mount_unit is changed

- name: Mount aktif + saat boot
  ansible.builtin.systemd_service:
    name: "{{ ci_runner_mountpoint | regex_replace('^/', '') | replace('/', '-') }}.mount"
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

- name: Pastikan benar-benar ter-mount (bukan direktori kosong di /)
  ansible.builtin.command:
    cmd: "findmnt -n -o SOURCE,FSTYPE,OPTIONS --mountpoint {{ ci_runner_mountpoint }}"
  register: ci_runner_findmnt
  changed_when: false
  check_mode: false
  failed_when: >-
    ci_runner_findmnt.rc != 0 or 'ext4' not in ci_runner_findmnt.stdout or
    'nosuid' not in ci_runner_findmnt.stdout
  when: not ansible_check_mode

- name: /srv/ci tidak di-mount dengan discard dan tidak ikut fstrim.timer
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      findmnt -n -o OPTIONS --mountpoint {{ ci_runner_mountpoint }} | tr ',' '\n' | grep -qx discard && echo MOUNT-DISCARD;
      fstrim --listed-in /etc/fstab:/proc/self/mountinfo --dry-run -v 2>/dev/null | grep -F '{{ ci_runner_mountpoint }}:' || true
    executable: /bin/bash
  register: ci_runner_trim_check
  changed_when: false
  check_mode: false
  failed_when: ci_runner_trim_check.stdout | trim != ''
  when: not ansible_check_mode

- name: Root filesystem /srv/ci 0700 (setelah mount)
  ansible.builtin.file:
    path: "{{ ci_runner_mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: not ansible_check_mode

# docker/ = data-root dockerd DALAM (root di container ↔ root host lewat ID-mapped mount sysbox).
- name: Direktori data dockerd dalam
  ansible.builtin.file:
    path: "{{ ci_runner_mountpoint }}/docker"
    state: directory
    owner: root
    group: root
    mode: "0710"
  when: not ansible_check_mode

- name: Direktori cache (milik uid runner)
  ansible.builtin.file:
    path: "{{ ci_runner_mountpoint }}/cache/{{ item }}"
    state: directory
    owner: "{{ ci_runner_uid }}"
    group: "{{ ci_runner_gid }}"
    mode: "0750"
  loop: "{{ [''] + ci_runner_cache_subdirs }}"
  when: not ansible_check_mode
