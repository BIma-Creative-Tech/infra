---
# TIDAK me-restart paksa (restart membatalkan job yang sedang berjalan). Sejak R12 supervisor memantau skrip,
# supervisor.env, unit & PAT dan me-restart dirinya di titik aman (idle / antar job). Supervisor versi < R12 (tanpa
# fitur ini) harus di-restart manual saat idle: docs/03-operations/ci-runner.md §Deploy perubahan.
- name: Restart ci-runner-supervisor
  ansible.builtin.debug:
    msg: "ci-runner-supervisor akan memuat ulang sendiri di titik aman (idle/antar job); tidak di-restart paksa."

- name: Reload systemd (ci_runner)
  ansible.builtin.systemd_service:
    daemon_reload: true
