---
# Restart hanya bila service sedang berjalan (tanpa PAT: tidak berjalan → tidak ada yang di-restart).
- name: Restart ci-runner-supervisor
  ansible.builtin.command:
    cmd: systemctl try-restart ci-runner-supervisor.service
  changed_when: true

- name: Reload systemd (ci_runner)
  ansible.builtin.systemd_service:
    daemon_reload: true
