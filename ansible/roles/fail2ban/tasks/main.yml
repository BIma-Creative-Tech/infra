---
- name: Pasang fail2ban
  ansible.builtin.apt:
    name: [fail2ban, python3-systemd]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Konfigurasi jail sshd (jail.d/*.local dibaca setelah defaults-debian.conf)
  ansible.builtin.template:
    src: infra-sshd.local.j2
    dest: /etc/fail2ban/jail.d/infra-sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  tags: [ssh_phase_c]

- name: fail2ban aktif
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
