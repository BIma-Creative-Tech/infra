---
docker_daemon_json:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
    # H3: nama container & label compose ditulis di setiap baris json-file (field `attrs`) →
    # Alloy membaca file log langsung tanpa Docker API (docs/03-operations/observability.md).
    # Opsi `tag`/`labels` json-file diverifikasi dari source moby docker-v29.8.1
    # (daemon/logger/jsonfilelog/jsonfilelog.go ValidateLogOpt + New). Hanya berlaku untuk container
    # yang DIBUAT setelah dockerd restart (daemon/create.go mergeAndVerifyLogConfig).
    # `!unsafe`: cegah Jinja merender template Go `{{.Name}}`.
    tag: !unsafe "{{.Name}}"
    labels: com.docker.compose.project,com.docker.compose.service
  live-restore: true
  userland-proxy: false
  no-new-privileges: true
  icc: false
  # T19 follow-up (ADR 0004 §"Pengukuran ulang T19" R1; keputusan user 2026-09-25): batasi build cache BuildKit
  # builder bawaan (driver `docker`). Kunci diverifikasi dari moby docker-v29.8.1 daemon/config/builder.go
  # (BuilderGCConfig: Enabled, DefaultReservedSpace, DefaultMaxUsedSpace, DefaultMinFreeSpace) + docker/cli
  # v29.8.1 docs/reference/dockerd.md. Nilai diparse `units.RAMInBytes` → "GB" = GiB (1024³), TANPA persen.
  # Tanpa `policy` → dipakai 4 aturan bawaan (daemon/internal/builder-next/worker/gc.go DefaultGCPolicy)
  # dengan tiga ambang di bawah. TIDAK memakai `defaultKeepStorage` (usang; di v29 = alias reservedSpace/lantai)
  # dan tidak memakai `keepDuration` di `policy` custom (bukan field BuilderGCRule v29.8.1 → diabaikan diam-diam).
  # `builder` TIDAK termasuk opsi reload (SIGHUP) → berlaku setelah restart dockerd (live-restore menjaga container).
  builder:
    gc:
      enabled: true
      # Plafon build cache (tidak-shared) ±10 GiB.
      defaultMaxUsedSpace: 10GB
      # Lantai: GC tidak memangkas cache di bawah ini.
      defaultReservedSpace: 2GB
      # Pangkas cache bila statfs Bfree < 56 GiB. Bfree termasuk ±15,6 GiB blok reserved/overhead ext4 yang tidak
      # terlihat di `df` Avail → 56 GiB Bfree ≈ 40 GiB Avail ≈ ≥ 20% dari 193G (df Use% ≤ ±79%).
      # Hanya memangkas BUILD CACHE, bukan image/volume/worktree.
      defaultMinFreeSpace: 56GB
  # Plan 12 R0/R2 (ADR 0014): `bip` + `default-address-pools` ditulis EKSPLISIT dengan nilai IDENTIK perilaku sekarang
  # (docker0 172.17.0.1/16 [NYATA `ip -4 addr show docker0` 2026-09-28]; pool = daftar bawaan
  # moby docker-v29.8.1 daemon/libnetwork/ipamutils/utils.go localScopeDefaultNetworks). Alasan: postinst
  # sysbox-ce 0.7.1 (`adjust_docker_config_network`) hanya MENULIS nilainya sendiri (172.20.0.1/16, 172.25.0.0/16) dan
  # me-restart dockerd bila kedua kunci ini belum ada; bila sudah ada → tidak ada perubahan network, tidak ada restart
  # (docs/qa/2026-09-28-plan12-r0-sysbox-postinst.md). Keduanya BUKAN opsi reload (daemon/reload.go) → baru dipakai saat
  # dockerd restart berikutnya, dan karena nilainya identik, tidak ada perubahan perilaku. Semua network platform
  # memakai subnet eksplisit (10.100.x.0/24), jadi pool hanya berlaku untuk network tanpa subnet.
  bip: 172.17.0.1/16
  default-address-pools:
    - { base: 172.17.0.0/16, size: 16 }
    - { base: 172.18.0.0/16, size: 16 }
    - { base: 172.19.0.0/16, size: 16 }
    - { base: 172.20.0.0/14, size: 16 }
    - { base: 172.24.0.0/14, size: 16 }
    - { base: 172.28.0.0/14, size: 16 }
    - { base: 192.168.0.0/16, size: 20 }

# Plan 12 R2: runtime OCI tambahan (digabung ke docker_daemon_json sebagai `runtimes`). `runtimes` ADALAH opsi reload
# (daemon/reload_unix.go reloadPlatform) → cukup SIGHUP. Path runtime baru di-LookPath saat container dibuat
# (daemon/runtime_unix.go), jadi mendaftarkan sebelum binari ada tidak merusak dockerd. Diisi di group_vars.
docker_daemon_runtimes: {}

# Aksi saat daemon.json berubah. `reload` (default, SIGHUP via ExecReload unit docker.service) = tanpa restart; opsi
# non-reload (builder, bip, pool, dll.) baru berlaku pada restart TERJADWAL berikutnya. `restart` hanya boleh dipakai
# eksplisit di jendela sepi (ADR 0004 §8.1) dengan konfirmasi Lead: -e docker_daemon_json_change_action=restart.
docker_daemon_json_change_action: reload # reload | restart | none
