---
# Dipakai oleh semua fase. Membutuhkan var ssh_render_phase.
- name: Tulis drop-in sshd 00-hardening.conf (fase {{ ssh_render_phase }})
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  register: ssh_dropin

- name: Validasi konfigurasi sshd lengkap (sshd -t)
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false

- name: daemon-reload + restart ssh.socket (README.Debian openssh-server — socket activation)
  when: ssh_dropin is changed
  block:
    - name: systemctl daemon-reload
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: systemctl restart ssh.socket (BUKAN ssh.service)
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: restarted
