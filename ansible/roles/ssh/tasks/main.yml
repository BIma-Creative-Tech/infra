  tags: [ssh_phase_a]

- name: Fase B (S6) — hardening penuh, port ganda
  ansible.builtin.import_tasks: phase_b.yml
  tags: [ssh_phase_b]

- name: Fase C (S8) — tutup port 22
  ansible.builtin.import_tasks: phase_c.yml
  tags: [ssh_phase_c]
