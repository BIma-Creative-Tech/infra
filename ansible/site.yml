---
# Bootstrap & hardening host — plan 01 (T01 + T02, plan 02).
# Urutan penerapan WAJIB mengikuti plan 01 §5 (S0–S9), satu tag per langkah:
#   S1 --tags users | S2 --tags firewall | S3 --tags ssh_phase_a
#   S6 --tags ssh_phase_b | S8 --tags ssh_phase_c
#   S9 --tags base,fail2ban,auditd,sysctl_swap,docker,unattended,layout,crowdsec_repo
#   T05 --tags crowdsec_bouncer (setelah stack security/crowdsec up)
#   T13 --tags backup (restic + timer; skrip di scripts/backup.sh, restore.sh, restore-test.sh)
#   H7  --tags healthcheck,backup (timer infra-healthcheck + alert email; OnFailure restic)
#   T19 --tags container_metrics (timer metrik per container → textfile node-exporter; ADR 0004 T19 §8.2)
#   P05 --tags infra_jobs,auditd (dispatcher infra-job + spool + unit; watch auditd /usr/local/sbin/infra-job)
# Tag ssh_phase_b / ssh_phase_c hanya boleh dijalankan Lead bersama user (S4–S7).
- name: Bootstrap host VPS
  hosts: vps
  become: true
  gather_facts: true

  pre_tasks:
    - name: Tentukan fase SSH efektif untuk run ini
      ansible.builtin.set_fact:
        ssh_requested_phases: >-
          {{ ['a', 'b', 'c'] | select('in', ansible_run_tags | map('regex_replace', '^ssh_phase_', '') | list) | list }}
      tags: [always]

    - name: Guard fase SSH (maks satu fase; hanya fase saat ini atau tepat berikutnya)
      ansible.builtin.assert:
        that:
          - ssh_phase in ['a', 'b', 'c']
          - ssh_requested_phases | length <= 1
          - >-
            ssh_requested_phases | length == 0 or
            ssh_requested_phases[0] == ssh_phase or
            (ssh_phase == 'a' and ssh_requested_phases[0] == 'b') or
            (ssh_phase == 'b' and ssh_requested_phases[0] == 'c')
        fail_msg: >-
          Fase SSH ditolak: ssh_phase (state host) = {{ ssh_phase }}, diminta = {{ ssh_requested_phases }}.
          Naikkan ssh_phase di group_vars hanya setelah fase sebelumnya lolos verifikasi plan 01 §5.
        quiet: true
      tags: [always]

    - name: Tetapkan fase SSH efektif
      ansible.builtin.set_fact:
        ssh_effective_phase: "{{ ssh_requested_phases[0] if ssh_requested_phases | length == 1 else ssh_phase }}"
      tags: [always]

  roles:
    - { role: users, tags: [users] }
    - { role: firewall, tags: [firewall] }
    - role: ssh # tanpa tag level-role: tiap task diberi tag fase sendiri
    - { role: base, tags: [base] }
    - { role: fail2ban, tags: [fail2ban] }
    - { role: sysctl_swap, tags: [sysctl_swap] }
    - { role: docker, tags: [docker] }
    - { role: auditd, tags: [auditd] }
    - { role: unattended, tags: [unattended] }
    - { role: layout, tags: [layout] }
    - { role: crowdsec_repo, tags: [crowdsec_repo] }
    # T05 (plan 02): butuh container crowdsec berjalan (security/crowdsec). Jalankan --tags crowdsec_bouncer.
    - { role: crowdsec_bouncer, tags: [crowdsec_bouncer] }
    # H7: healthcheck stack infra (timer 5 menit) + alert email + unit infra-unit-failure@ (OnFailure restic).
    #     Sebelum backup: unit OnFailure= yang dirujuk restic-* sudah ada.
    - { role: healthcheck, tags: [healthcheck] }
    # T13 (plan 02, ADR 0006): restic 0.19.1 terverifikasi + repo lokal + timer backup/prune/restore-test.
    - { role: backup, tags: [backup] }
    # Plan 05 J1/J4 (ADR 0009): dispatcher root infra-job + spool + unit path/service. Butuh infra-unit-failure@ (healthcheck).
    #   --tags infra_jobs (--check --diff dulu). Rollback: infra_jobs_state=absent / path_enabled=false (defaults role).
    - { role: infra_jobs, tags: [infra_jobs] }
    # T19 follow-up (ADR 0004 T19 §8.2): timer root 60 s → cgroup v2 per container → textfile node-exporter
    #   (/var/lib/node-exporter-textfile/containers.prom). --tags container_metrics (--check --diff dulu), lalu recreate
    #   node-exporter (observability/docker-compose.yml). Rollback: container_metrics_state=absent.
    - { role: container_metrics, tags: [container_metrics] }
