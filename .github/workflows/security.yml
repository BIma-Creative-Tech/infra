# Security CI — repo infra (compose, ansible, scripts bash/python, Containerfile).
# Semua tool dijalankan sebagai container ter-pin tag+digest (diverifikasi 2026-09-24,
# `docker buildx imagetools inspect`); action di-pin ke commit SHA tag rilis resmi.
# Tool yang sama bisa dijalankan lokal — lihat docs/04-development.md §CI.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1" # Senin 02:17 UTC (09:17 WIB): tangkap CVE/rule baru tanpa commit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # seluruh history
          persist-credentials: false
          submodules: false # addons dipindai di repo odoo-addons-shared
      - name: gitleaks (full history, .gitleaks.toml)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact --verbose --exit-code 1

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: semgrep scan
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src -v "$RUNNER_TEMP:/out" "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --disable-version-check \
              --config p/owasp-top-ten --config p/python --config p/javascript \
              --config p/dockerfile --config p/docker-compose --config p/secrets --config r/bash \
              --json-output=/out/semgrep.json .
      - name: gagal bila ada temuan ERROR/HIGH/CRITICAL
        run: |
          jq -r '.results[] | "\(.extra.severity)\t\(.check_id)\t\(.path):\(.start.line)"' "$RUNNER_TEMP/semgrep.json"
          n=$(jq '[.results[] | select(.extra.severity == "ERROR" or .extra.severity == "HIGH" or .extra.severity == "CRITICAL")] | length' "$RUNNER_TEMP/semgrep.json")
          echo "semgrep blocking findings: $n"
          test "$n" -eq 0

  trivy:
    name: trivy-fs-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: trivy fs (vuln + secret)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache" "$TRIVY_IMAGE" \
            fs --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src
      - name: trivy config (Dockerfile/Containerfile/IaC)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache" "$TRIVY_IMAGE" \
            config --quiet --severity HIGH,CRITICAL --ignorefile /src/.trivyignore.yaml --exit-code 1 /src

  hadolint:
    name: hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: hadolint (semua Dockerfile*/Containerfile ter-track)
        run: |
          rc=0
          while IFS= read -r f; do
            echo "== $f"
            docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold warning - < "$f" || rc=1
          done < <(git ls-files '*Dockerfile*' '*Containerfile*')
          exit "$rc"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: shellcheck (*.sh ter-track + .githooks)
        run: |
          mapfile -t files < <(git ls-files '*.sh' '.githooks/*')
          printf '%s\n' "${files[@]}"
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" \
            -x -P SCRIPTDIR -S warning -f gcc "${files[@]}"
