# Log sshd host: rsyslog aktif dan menulis sshd ke /var/log/auth.log (diverifikasi 2026-09-23:
# `grep -c sshd /var/log/auth.log` > 0). /var/log host di-mount read-only ke /var/log/host
# (mount direktori, bukan file, agar rotasi logrotate tetap terikuti).
# type=syslog → parser crowdsecurity/syslog-logs (collection linux) → crowdsecurity/sshd-logs.
source: file
filenames:
  - /var/log/host/auth.log
labels:
  type: syslog
