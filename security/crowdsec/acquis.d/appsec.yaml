# AppSec (WAF) — docs crowdsec appsec/quickstart/traefik.mdx & data_sources/appsec.md.
# listen 0.0.0.0 DI DALAM container; port 7422 TIDAK di-publish — hanya dicapai Traefik lewat
# network internal `crowdsec`.
source: appsec
listen_addr: 0.0.0.0:7422
path: /
appsec_configs:
  - crowdsecurity/appsec-default
  # OWASP CRS blocking (collection crowdsecurity/appsec-crs-inband) — lihat docker-compose.yml.
  - crowdsecurity/crs-inband
  # T10: pre_eval — nonaktifkan rule CRS `attack-xss` hanya untuk endpoint JSON-RPC Odoo yang
  # membawa HTML (security/crowdsec/appsec-configs/odoo-crs-exclusions.yaml).
  - local/odoo-crs-exclusions
  # H4: pre_eval — nonaktifkan HANYA rule CRS 911100 (method policy) untuk Admin REST Keycloak
  # (host auth.bimacreative.tech, path /admin/realms/*) — appsec-configs/keycloak-admin-exclusions.yaml.
  - local/keycloak-admin-exclusions
  # H6: pre_eval — nonaktifkan HANYA rule CRS 920420 (content type text/plain) untuk Server Action Next.js
  # control plane (host cp / cp.staging, POST + Next-Action) — appsec-configs/controlplane-crs-exclusions.yaml.
  - local/controlplane-crs-exclusions
  # H7(a): pre_eval — nonaktifkan HANYA rule CRS 920420 untuk Server Action admin Payload ProyekKas
  # (host drms-kas(.staging), POST /admin/* + Next-Action) — appsec-configs/drms-payload-crs-exclusions.yaml.
  - local/drms-payload-crs-exclusions
  # Plan 04 BUG-S5-01: pre_eval — nonaktifkan HANYA rule CRS bertag attack-sqli untuk POST token endpoint
  # realm platform(-staging) dari hairpin 10.100.0.1 (back-channel Odoo) — appsec-configs/oidc-backchannel-exclusions.yaml.
  - local/oidc-backchannel-exclusions
  # erajaya-loyalty staging: pre_eval — HANYA 920420 (Server Action admin Payload, POST /admin/* + Next-Action) dan 911100
  # (PATCH/DELETE /api/* kecuali /api/pos|member|cron/), host erajaya-loyalty.staging — appsec-configs/erajaya-payload-crs-exclusions.yaml.
  - local/erajaya-payload-crs-exclusions
labels:
  type: appsec
